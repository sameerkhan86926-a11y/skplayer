<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#0f0f0f"
  />

  <meta
    name="description"
    content="SKPlayer - Discover and watch music, videos, Shorts and more."
  />

  <title>SKPlayer</title>

  <link rel="icon" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ytBlack: "#0f0f0f",
            ytElevated: "#181818",
            ytPill: "#272727",
            ytBorder: "#2e2e2e",
            ytRed: "#ff0000"
          }
        }
      }
    };
  </script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      color: #fff;
      font-family: Roboto, Arial, sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0f0f0f;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #666;
    }

    .glass {
      background: rgba(15, 15, 15, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .sidebar-item {
      transition: background .18s ease, transform .18s ease;
    }

    .sidebar-item:hover {
      background: #272727;
    }

    .sidebar-item.active {
      background: #272727;
      font-weight: 500;
    }

    .chip {
      white-space: nowrap;
      transition: .18s ease;
    }

    .chip:hover {
      background: #3f3f3f;
    }

    .chip.active {
      background: #fff;
      color: #111;
    }

    .video-card {
      transition:
        transform .18s ease,
        background .18s ease;
    }

    .video-card:hover {
      transform: translateY(-2px);
    }

    .thumbnail-wrap {
      overflow: hidden;
      border-radius: 12px;
      background: #181818;
    }

    .thumbnail-wrap img {
      transition: transform .25s ease;
    }

    .video-card:hover .thumbnail-wrap img {
      transform: scale(1.025);
    }

    .duration {
      position: absolute;
      right: 7px;
      bottom: 7px;
      background: rgba(0, 0, 0, .85);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .line-clamp-3 {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }

    .skeleton {
      background:
        linear-gradient(
          90deg,
          #181818 25%,
          #242424 37%,
          #181818 63%
        );
      background-size: 400% 100%;
      animation: skeleton 1.4s ease infinite;
    }

    @keyframes skeleton {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: -100% 0;
      }
    }

    .modal-backdrop {
      background: rgba(0, 0, 0, .72);
      backdrop-filter: blur(4px);
    }

    .toast {
      animation: toastIn .25s ease;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 15px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .fade-in {
      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .player-container {
      background: #000;
      aspect-ratio: 16 / 9;
    }

    .short-container {
      aspect-ratio: 9 / 16;
      max-height: calc(100vh - 180px);
    }

    .scroll-x {
      overflow-x: auto;
      scrollbar-width: none;
    }

    .scroll-x::-webkit-scrollbar {
      display: none;
    }

    .sidebar-mini .sidebar-label {
      display: none;
    }

    .sidebar-mini {
      width: 72px !important;
    }

    .sidebar-mini .sidebar-item {
      justify-content: center;
    }

    .sidebar-mini .sidebar-section-title {
      display: none;
    }

    .mobile-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 767px) {
      .desktop-only {
        display: none !important;
      }

      body {
        padding-bottom: 68px;
      }

      .thumbnail-wrap {
        border-radius: 9px;
      }
    }

    @media (min-width: 768px) {
      .mobile-only {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- SPLASH -->
  <div
    id="splash"
    class="fixed inset-0 z-[9999] bg-ytBlack flex items-center justify-center"
  >
    <div class="text-center">
      <img
        src="android-chrome-192x192.png"
        class="w-20 h-20 mx-auto rounded-2xl mb-4"
        onerror="this.src='favicon-32x32.png'"
        alt="SKPlayer"
      />

      <div class="text-2xl font-bold">
        <span class="text-white">SK</span><span class="text-red-500">Player</span>
      </div>

      <div class="text-xs text-gray-500 mt-2">
        Watch. Discover. Enjoy.
      </div>
    </div>
  </div>


  <!-- HEADER -->
  <header
    class="fixed top-0 left-0 right-0 h-16 glass border-b border-ytBorder z-50"
  >
    <div class="h-full flex items-center px-3 md:px-5 gap-3">

      <!-- MENU -->
      <button
        onclick="toggleSidebar()"
        class="w-10 h-10 rounded-full hover:bg-ytPill flex items-center justify-center"
        aria-label="Menu"
      >
        <i class="fa-solid fa-bars"></i>
      </button>


      <!-- LOGO -->
      <button
        onclick="goHome()"
        class="flex items-center gap-2 shrink-0"
      >
        <img
          src="android-chrome-192x192.png"
          class="w-8 h-8 rounded-lg"
          onerror="this.src='favicon-32x32.png'"
          alt=""
        />

        <span class="hidden sm:block text-xl font-bold tracking-tight">
          <span>SK</span><span class="text-red-500">Player</span>
        </span>

        <span class="hidden lg:block text-[10px] text-gray-500 font-bold">
          PRO
        </span>
      </button>


      <!-- DESKTOP SEARCH -->
      <div class="hidden md:flex flex-1 max-w-2xl mx-auto">

        <div
          class="flex w-full h-10 bg-[#121212] border border-[#303030] rounded-full overflow-hidden"
        >
          <input
            id="searchInput"
            type="search"
            placeholder="Search"
            autocomplete="off"
            class="flex-1 bg-transparent outline-none px-5 text-sm"
            onkeydown="handleSearchKey(event)"
          />

          <button
            onclick="performSearch()"
            class="w-16 bg-[#222] border-l border-[#303030] hover:bg-[#303030]"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <button
          onclick="startVoiceSearch()"
          class="ml-3 w-10 h-10 rounded-full hover:bg-ytPill"
          aria-label="Voice search"
        >
          <i class="fa-solid fa-microphone"></i>
        </button>
      </div>


      <!-- MOBILE SEARCH -->
      <button
        onclick="openMobileSearch()"
        class="md:hidden ml-auto w-10 h-10 rounded-full hover:bg-ytPill"
        aria-label="Search"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>


      <!-- HEADER ACTIONS -->
      <div class="flex items-center gap-1 ml-auto md:ml-0">

        <button
          onclick="toggleAudioMode()"
          id="audioBtn"
          class="hidden sm:flex items-center gap-2 px-3 h-9 rounded-full hover:bg-ytPill text-sm"
          title="Audio mode"
        >
          <i class="fa-solid fa-headphones"></i>
          <span>Audio</span>
        </button>

        <button
          onclick="showToast('Create feature coming soon')"
          class="hidden md:flex items-center gap-2 px-4 h-9 rounded-full bg-ytPill hover:bg-[#3a3a3a] text-sm"
        >
          <i class="fa-solid fa-plus"></i>
          <span>Create</span>
        </button>

        <button
          onclick="showToast('Notifications are coming soon')"
          class="w-10 h-10 rounded-full hover:bg-ytPill"
          aria-label="Notifications"
        >
          <i class="fa-regular fa-bell"></i>
        </button>

        <button
          onclick="switchMainTab('library')"
          class="w-9 h-9 rounded-full bg-red-600 flex items-center justify-center font-bold"
          aria-label="Profile"
        >
          S
        </button>

      </div>
    </div>
  </header>


  <!-- MOBILE SEARCH OVERLAY -->
  <div
    id="mobileSearch"
    class="hidden fixed inset-0 z-[100] bg-ytBlack"
  >
    <div class="h-16 flex items-center gap-2 px-3 border-b border-ytBorder">

      <button
        onclick="closeMobileSearch()"
        class="w-10 h-10 rounded-full hover:bg-ytPill"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <input
        id="mobileSearchInput"
        class="flex-1 h-10 bg-[#181818] rounded-full px-4 outline-none border border-[#303030]"
        placeholder="Search"
        onkeydown="handleMobileSearchKey(event)"
      />

      <button
        onclick="performMobileSearch()"
        class="w-10 h-10 rounded-full bg-ytPill"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <div
      id="mobileSuggestions"
      class="p-4 space-y-2"
    ></div>
  </div>


  <!-- VOICE MODAL -->
  <div
    id="voiceModal"
    class="hidden fixed inset-0 z-[200] modal-backdrop items-center justify-center p-5"
  >
    <div class="w-full max-w-sm bg-[#212121] rounded-2xl p-8 text-center">

      <div
        id="voiceIcon"
        class="w-20 h-20 rounded-full bg-red-600 mx-auto flex items-center justify-center text-3xl"
      >
        <i class="fa-solid fa-microphone"></i>
      </div>

      <h3 class="text-xl font-bold mt-5">
        Listening...
      </h3>

      <p
        id="voiceText"
        class="text-gray-400 text-sm mt-2"
      >
        Speak your search
      </p>

      <button
        onclick="closeVoiceModal()"
        class="mt-7 px-5 py-2.5 rounded-full bg-ytPill hover:bg-[#3a3a3a]"
      >
        Cancel
      </button>

    </div>
  </div>


  <!-- SIDEBAR -->
  <aside
    id="sidebar"
    class="fixed left-0 top-16 bottom-0 w-60 bg-ytBlack border-r border-ytBorder z-40 overflow-y-auto transition-all duration-200 hidden md:block"
  >

    <div class="p-3">

      <button
        class="sidebar-item active w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        data-tab="home"
        onclick="switchMainTab('home')"
      >
        <i class="fa-solid fa-house w-5 text-center"></i>
        <span class="sidebar-label">Home</span>
      </button>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        data-tab="shorts"
        onclick="switchMainTab('shorts')"
      >
        <i class="fa-solid fa-play w-5 text-center"></i>
        <span class="sidebar-label">Shorts</span>
      </button>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        data-tab="subscriptions"
        onclick="switchMainTab('subscriptions')"
      >
        <i class="fa-solid fa-layer-group w-5 text-center"></i>
        <span class="sidebar-label">Subscriptions</span>
      </button>

      <div class="border-t border-ytBorder my-3"></div>

      <div class="sidebar-section-title px-4 py-2 text-xs text-gray-500 uppercase">
        You
      </div>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        data-tab="history"
        onclick="switchMainTab('history')"
      >
        <i class="fa-solid fa-clock-rotate-left w-5 text-center"></i>
        <span class="sidebar-label">History</span>
      </button>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        data-tab="library"
        onclick="switchMainTab('library')"
      >
        <i class="fa-solid fa-folder w-5 text-center"></i>
        <span class="sidebar-label">Library</span>
      </button>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        data-tab="liked"
        onclick="switchMainTab('liked')"
      >
        <i class="fa-solid fa-thumbs-up w-5 text-center"></i>
        <span class="sidebar-label">Liked videos</span>
      </button>

      <div class="border-t border-ytBorder my-3"></div>

      <div class="sidebar-section-title px-4 py-2 text-xs text-gray-500 uppercase">
        Explore
      </div>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        onclick="searchCategory('Music')"
      >
        <i class="fa-solid fa-music w-5 text-center"></i>
        <span class="sidebar-label">Music</span>
      </button>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        onclick="searchCategory('Gaming')"
      >
        <i class="fa-solid fa-gamepad w-5 text-center"></i>
        <span class="sidebar-label">Gaming</span>
      </button>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        onclick="searchCategory('News India')"
      >
        <i class="fa-regular fa-newspaper w-5 text-center"></i>
        <span class="sidebar-label">News</span>
      </button>

      <button
        class="sidebar-item w-full flex items-center gap-5 rounded-xl px-4 py-3 text-sm"
        onclick="searchCategory('Sports India')"
      >
        <i class="fa-solid fa-trophy w-5 text-center"></i>
        <span class="sidebar-label">Sports</span>
      </button>

    </div>
  </aside>


  <!-- MAIN -->
  <main
    id="mainContent"
    class="pt-16 md:pl-60 transition-all duration-200"
  >

    <!-- CATEGORY BAR -->
    <div
      id="categoryBar"
      class="sticky top-16 z-30 bg-ytBlack border-b border-ytBorder"
    >
      <div
        id="categoryScroller"
        class="scroll-x flex gap-3 px-4 md:px-6 py-3"
      >

        <button
          class="chip active px-4 py-2 rounded-lg bg-ytPill text-sm"
          onclick="quickFilter('Trending Songs India', this)"
        >
          All
        </button>

        <button
          class="chip px-4 py-2 rounded-lg bg-ytPill text-sm"
          onclick="quickFilter('Bollywood songs India', this)"
        >
          Bollywood
        </button>

        <button
          class="chip px-4 py-2 rounded-lg bg-ytPill text-sm"
          onclick="quickFilter('Punjabi songs', this)"
        >
          Punjabi
        </button>

        <button
          class="chip px-4 py-2 rounded-lg bg-ytPill text-sm"
          onclick="quickFilter('Arijit Singh songs', this)"
        >
          Arijit Singh
        </button>

        <button
          class="chip px-4 py-2 rounded-lg bg-ytPill text-sm"
          onclick="quickFilter('Indian podcasts', this)"
        >
          Podcasts
        </button>

        <button
          class="chip px-4 py-2 rounded-lg bg-ytPill text-sm"
          onclick="quickFilter('Indian gaming', this)"
        >
          Gaming
        </button>

        <button
          class="chip px-4 py-2 rounded-lg bg-ytPill text-sm"
          onclick="quickFilter('lofi music India', this)"
        >
          Lo-Fi
        </button>

      </div>
    </div>


    <!-- CONTENT -->
    <div
      id="app"
      class="px-4 md:px-6 py-5"
    ></div>

  </main>


  <!-- MOBILE NAV -->
  <nav
    class="mobile-only fixed bottom-0 left-0 right-0 z-50 bg-[#0f0f0f]/95 border-t border-ytBorder mobile-bottom"
  >
    <div class="h-16 flex items-center justify-around">

      <button
        onclick="switchMainTab('home')"
        class="flex flex-col items-center gap-1 text-[11px]"
      >
        <i class="fa-solid fa-house text-base"></i>
        <span>Home</span>
      </button>

      <button
        onclick="switchMainTab('shorts')"
        class="flex flex-col items-center gap-1 text-[11px]"
      >
        <i class="fa-solid fa-play text-base"></i>
        <span>Shorts</span>
      </button>

      <button
        onclick="startVoiceSearch()"
        class="w-12 h-12 rounded-full bg-white text-black flex items-center justify-center -mt-5 border-4 border-ytBlack"
      >
        <i class="fa-solid fa-microphone"></i>
      </button>

      <button
        onclick="switchMainTab('subscriptions')"
        class="flex flex-col items-center gap-1 text-[11px]"
      >
        <i class="fa-solid fa-layer-group text-base"></i>
        <span>Subs</span>
      </button>

      <button
        onclick="switchMainTab('library')"
        class="flex flex-col items-center gap-1 text-[11px]"
      >
        <i class="fa-solid fa-folder text-base"></i>
        <span>You</span>
      </button>

    </div>
  </nav>


  <!-- VIDEO MODAL / WATCH VIEW -->
  <div
    id="watchView"
    class="hidden fixed inset-0 z-[80] bg-ytBlack overflow-y-auto"
  >

    <div class="max-w-[1700px] mx-auto">

      <!-- WATCH HEADER -->
      <div
        class="sticky top-0 z-20 h-14 bg-ytBlack/95 backdrop-blur border-b border-ytBorder flex items-center px-3 md:px-5"
      >

        <button
          onclick="closeWatchView()"
          class="w-10 h-10 rounded-full hover:bg-ytPill"
        >
          <i class="fa-solid fa-arrow-left"></i>
        </button>

        <span class="ml-2 font-semibold">
          SKPlayer
        </span>

        <button
          onclick="shareCurrentVideo()"
          class="ml-auto w-10 h-10 rounded-full hover:bg-ytPill"
        >
          <i class="fa-solid fa-share"></i>
        </button>

      </div>


      <div class="p-3 md:p-6">

        <div class="grid lg:grid-cols-[minmax(0,2fr)_minmax(300px,1fr)] gap-5">

          <!-- PLAYER SIDE -->
          <section>

            <div
              id="playerBox"
              class="player-container rounded-xl overflow-hidden relative"
            >

              <div
                id="youtubePlayer"
                class="absolute inset-0"
              ></div>

              <div
                id="audioOverlay"
                class="hidden absolute inset-0 bg-black/95 items-center justify-center"
              >
                <div class="text-center">
                  <div class="w-20 h-20 rounded-full bg-red-600 mx-auto flex items-center justify-center text-3xl">
                    <i class="fa-solid fa-headphones"></i>
                  </div>

                  <p class="mt-4 font-medium">
                    Audio mode
                  </p>
                </div>
              </div>

            </div>


            <!-- VIDEO TITLE -->
            <div class="mt-4">

              <h1
                id="watchTitle"
                class="text-xl md:text-2xl font-bold leading-tight"
              >
                Loading...
              </h1>

              <div class="mt-3 flex flex-wrap items-center gap-3">

                <div
                  id="watchChannelAvatar"
                  class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center font-bold"
                >
                  S
                </div>

                <div class="mr-auto">

                  <div
                    id="watchChannel"
                    class="font-semibold"
                  >
                    Channel
                  </div>

                  <div
                    id="watchSubscribers"
                    class="text-xs text-gray-400"
                  >
                    --
                  </div>

                </div>

                <button
                  id="subscribeBtn"
                  onclick="toggleSubscribe()"
                  class="px-5 py-2.5 rounded-full bg-white text-black font-semibold text-sm"
                >
                  Subscribe
                </button>

              </div>


              <!-- ACTIONS -->
              <div class="flex flex-wrap gap-2 mt-4">

                <button
                  id="likeBtn"
                  onclick="toggleLikeCurrent()"
                  class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-ytPill hover:bg-[#3a3a3a] text-sm"
                >
                  <i class="fa-regular fa-thumbs-up"></i>
                  <span id="likeCount">Like</span>
                </button>

                <button
                  onclick="showToast('Dislike registered')"
                  class="px-4 py-2.5 rounded-full bg-ytPill hover:bg-[#3a3a3a]"
                >
                  <i class="fa-regular fa-thumbs-down"></i>
                </button>

                <button
                  onclick="shareCurrentVideo()"
                  class="flex items-center gap-2 px-4 py-2.5 rounded-full bg-ytPill hover:bg-[#3a3a3a] text-sm"
                >
                  <i class="fa-solid fa-share"></i>
                  Share
                </button>

                <button
                  onclick="togglePiP()"
                  class="px-4 py-2.5 rounded-full bg-ytPill hover:bg-[#3a3a3a]"
                  title="Picture in Picture"
                >
                  <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
                </button>

                <button
                  onclick="openSpeedModal()"
                  class="px-4 py-2.5 rounded-full bg-ytPill hover:bg-[#3a3a3a] text-sm"
                >
                  Speed
                </button>

                <button
                  onclick="openSleepModal()"
                  class="px-4 py-2.5 rounded-full bg-ytPill hover:bg-[#3a3a3a] text-sm"
                >
                  Sleep
                </button>

              </div>


              <!-- DESCRIPTION -->
              <div
                id="watchDescription"
                class="mt-4 p-4 bg-[#181818] rounded-xl text-sm leading-relaxed text-gray-300"
              >
                Loading description...
              </div>


              <!-- COMMENTS -->
              <div class="mt-6">

                <div class="flex items-center justify-between mb-4">

                  <h2 class="text-lg font-bold">
                    Comments
                  </h2>

                  <span
                    id="commentCount"
                    class="text-sm text-gray-400"
                  ></span>

                </div>

                <div
                  id="comments"
                  class="space-y-5"
                ></div>

              </div>

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatNumber(number) {

      const n = Number(number || 0);

      if (n >= 1000000000) {
        return (n / 1000000000).toFixed(1) + "B";
      }

      if (n >= 1000000) {
        return (n / 1000000).toFixed(1) + "M";
      }

      if (n >= 1000) {
        return (n / 1000).toFixed(1) + "K";
      }

      return String(n);

    }


    function formatDuration(iso) {

      if (!iso) return "";

      const match =
        iso.match(
          /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/
        );

      if (!match) return "";

      const hours = Number(match[1] || 0);
      const minutes = Number(match[2] || 0);
      const seconds = Number(match[3] || 0);

      const hh =
        hours > 0
          ? hours + ":" + String(minutes).padStart(2, "0")
          : String(minutes);

      return (
        hh +
        ":" +
        String(seconds).padStart(2, "0")
      );

    }


    function formatTimeAgo(dateString) {

      if (!dateString) return "";

      const date = new Date(dateString);

      const seconds =
        Math.floor(
          (Date.now() - date.getTime()) / 1000
        );

      if (seconds < 60) {
        return "just now";
      }

      const minutes =
        Math.floor(seconds / 60);

      if (minutes < 60) {
        return minutes + " minutes ago";
      }

      const hours =
        Math.floor(minutes / 60);

      if (hours < 24) {
        return hours + " hours ago";
      }

      const days =
        Math.floor(hours / 24);

      if (days < 30) {
        return days + " days ago";
      }

      const months =
        Math.floor(days / 30);

      if (months < 12) {
        return months + " months ago";
      }

      return (
        Math.floor(months / 12) +
        " years ago"
      );

    }

    /* =========================================================
       YOUTUBE API
    ========================================================= */

    async function youtubeFetch(
      endpoint,
      params = {}
    ) {

      if (
        !API_KEY ||
        API_KEY === "YOUR_YOUTUBE_API_KEY"
      ) {

        throw new Error(
          "YouTube API key is not configured."
        );

      }

      const url =
        new URL(
          "https://www.googleapis.com/youtube/v3/" +
          endpoint
        );

      Object.entries({
        ...params,
        key: API_KEY
      }).forEach(
        ([key, value]) => {
          url.searchParams.set(
            key,
            value
          );
        }
      );

      const response =
        await fetch(url.toString());

      if (!response.ok) {

        let message =
          "YouTube API request failed.";

        try {

          const data =
            await response.json();

          message =
            data?.error?.message ||
            message;

        } catch {}

        throw new Error(message);

      }

      return response.json();

    }


    async function getVideoDetails(ids) {

      if (!ids.length) {
        return [];
      }

      const uniqueIds =
        [...new Set(ids)]
          .slice(0, 50);

      const data =
        await youtubeFetch(
          "videos",
          {
            part:
              "snippet,contentDetails,statistics",
            id:
              uniqueIds.join(",")
          }
        );

      return data.items || [];

    }


    async function searchYouTube(
      query,
      append = false
    ) {

      if (isLoading) return;

      isLoading = true;

      renderSkeleton();

      try {

        const searchData =
          await youtubeFetch(
            "search",
            {
              part: "snippet",
              type: "video",
              maxResults: 25,
              q: query,
              pageToken:
                append
                  ? nextPageToken
                  : ""
            }
          );

        nextPageToken =
          searchData.nextPageToken || "";

        const ids =
          (searchData.items || [])
            .map(
              item =>
                item.id?.videoId
            )
            .filter(Boolean);

        const details =
          await getVideoDetails(ids);

        const detailMap =
          new Map(
            details.map(
              item => [
                item.id,
                item
              ]
            )
          );

        const videos =
          (searchData.items || [])
            .map(item => {

              const id =
                item.id?.videoId;

              const detail =
                detailMap.get(id);

              if (!id || !detail) {
                return null;
              }

              return normalizeVideo(
                detail
              );

            })
            .filter(Boolean);

        if (append) {

          loadedVideos.push(
            ...videos
          );

        } else {

          loadedVideos =
            videos;

        }

        currentQuery =
          query;

        renderHome();

      } catch (error) {

        console.error(error);

        renderError(
          error.message ||
          "Unable to load videos."
        );

      } finally {

        isLoading = false;

      }

    }


    async function getTrendingVideos() {

      if (isLoading) return;

      isLoading = true;

      renderSkeleton();

      try {

        const data =
          await youtubeFetch(
            "videos",
            {
              part:
                "snippet,contentDetails,statistics",
              chart: "mostPopular",
              regionCode: "IN",
              maxResults: 25
            }
          );

        loadedVideos =
          (data.items || [])
            .map(normalizeVideo);

        currentQuery =
          "Trending Songs India";

        renderHome();

      } catch (error) {

        console.error(error);

        renderError(
          error.message ||
          "Unable to load trending videos."
        );

      } finally {

        isLoading = false;

      }

    }


    function normalizeVideo(item) {

      return {

        id:
          item.id,

        title:
          item.snippet?.title ||
          "Untitled video",

        channelId:
          item.snippet?.channelId ||
          "",

        channelTitle:
          item.snippet?.channelTitle ||
          "Unknown channel",

        thumbnail:
          item.snippet?.thumbnails?.high?.url ||
          item.snippet?.thumbnails?.medium?.url ||
          item.snippet?.thumbnails?.default?.url ||
          `https://i.ytimg.com/vi/${item.id}/hqdefault.jpg`,

        publishedAt:
          item.snippet?.publishedAt ||
          "",

        description:
          item.snippet?.description ||
          "",

        duration:
          formatDuration(
            item.contentDetails?.duration
          ),

        views:
          Number(
            item.statistics?.viewCount ||
            0
          ),

        likes:
          Number(
            item.statistics?.likeCount ||
            0
          )

      };

    }

    function onYouTubeIframeAPIReady() {

      youtubePlayer =
        new YT.Player(
          "youtubePlayer",
          {

            videoId: "",

            playerVars: {
              autoplay: 0,
              controls: 1,
              playsinline: 1,
              rel: 0,
              modestbranding: 1,
              fs: 1
            },

            events: {

              onReady: () => {

                playerReady =
                  true;

              },

              onStateChange:
                onPlayerStateChange

            }

          }
        );

    }


    function loadYouTubePlayer(
      videoId
    ) {

      if (!youtubePlayer) {

        setTimeout(
          () =>
            loadYouTubePlayer(
              videoId
            ),
          500
        );

        return;

      }

      youtubePlayer.loadVideoById(
        videoId
      );

    }


    function onPlayerStateChange(
      event
    ) {

      if (
        event.data ===
        YT.PlayerState.ENDED
      ) {

        playNextVideo();

      }

    }


    function playNextVideo() {

      if (
        currentVideoIndex <
        loadedVideos.length - 1
      ) {

        currentVideoIndex++;

        openVideo(
          currentVideoIndex
        );

      } else {

        showToast(
          "No more videos"

    /* =========================================================
       COMMENTS
    ========================================================= */

    async function fetchComments(
      videoId
    ) {

      const container =
        document.getElementById(
          "comments"
        );

      container.innerHTML = `

        <div class="text-sm text-gray-500">
          Loading comments...
        </div>

      `;

      try {

        const data =
          await youtubeFetch(
            "commentThreads",
            {
              part:
                "snippet",
              videoId,
              maxResults: 20,
              order: "relevance"
            }
          );

        const items =
          data.items || [];

        document.getElementById(
          "commentCount"
        ).textContent =
          items.length
            ? `${items.length}+`
            : "";

        if (!items.length) {

          container.innerHTML = `

            <div class="text-gray-500 text-sm">
              No comments available.
            </div>

          `;

          return;

        }

        container.innerHTML =
          items.map(
            item => {

              const snippet =
                item.snippet
                  ?.topLevelComment
                  ?.snippet;

              if (!snippet) {
                return "";
              }

              const author =
                escapeHTML(
                  snippet.authorDisplayName
                );

              const text =
                escapeHTML(
                  snippet.textDisplay
                );

              const likes =
                formatNumber(
                  snippet.likeCount
                );

              return `

                <div class="flex gap-3">

                  <img
                    src="${escapeHTML(snippet.authorProfileImageUrl || "")}"
                    class="w-9 h-9 rounded-full object-cover shrink-0"
                    onerror="this.style.display='none'"
                    alt=""
                  />

                  <div class="min-w-0">

                    <div class="font-medium text-sm">
                      ${author}
                    </div>

                    <div class="text-sm text-gray-300 mt-1 whitespace-pre-wrap break-words">
                      ${text}
                    </div>

                    <div class="text-xs text-gray-500 mt-2">
                      ${likes} likes
                    </div>

                  </div>

                </div>

              `;

            }
          ).join("");

      } catch (error) {

        console.error(error);

        container.innerHTML = `

          <div class="text-sm text-gray-500">
            Comments are unavailable for this video.
          </div>

        `;

      }

    }

    function createPlaylist() {

      const name =
        prompt(
          "Playlist name:"
        );

      if (!name?.trim()) {
        return;
      }

      playlists.push({

        id:
          Date.now().toString(),

        name:
          name.trim(),

        videos: []

      });

      saveState();

      renderLibrary();

      showToast(
        "Playlist created"
      );

    }


    function addCurrentToPlaylist() {

      if (!currentVideo) {
        return;
      }

      if (!playlists.length) {

        createPlaylist();

        return;

      }

      const names =
        playlists
          .map(
            (p, i) =>
              `${i + 1}. ${p.name}`
          )
          .join("\n");

      const choice =
        prompt(
          `Choose playlist:\n\n${names}\n\nEnter number:`
        );

      const index =
        Number(choice) - 1;

      if (
        !Number.isInteger(index) ||
        !playlists[index]
      ) {
        return;
      }

      const playlist =
        playlists[index];

      if (
        !playlist.videos.some(
          video =>
            video.id ===
            currentVideo.id
        )
      ) {

        playlist.videos.push(
          currentVideo
        );

        saveState();

        showToast(
          "Added to playlist"
        );

      } else {

        showToast(
          "Already in playlist"
        );

      }

    }


    function playPlaylist(
      playlistId
    ) {

      const playlist =
        playlists.find(
          p =>
            p.id === playlistId
        );

      if (
        !playlist ||
        !playlist.videos.length
      ) {

        showToast(
          "Playlist is empty"
        );

        return;

      }

      loadedVideos =
        playlist.videos;

      currentVideoIndex = 0;

      openVideo(0);

    }

        activeTab = "home";

          "home"
        );

        if (
          !loadedVideos.length ||
          currentQuery ===
          "Trending Songs India"
        ) {

          getTrendingVideos();

        } else {

          renderHome();

        }

        return;

      }

      if (tab === "shorts") {

        openShorts();

        return;

      }

      if (
        tab ===
        "subscriptions"
      ) {

        renderSubscriptions();

        return;

      if (tab === "history") {

        renderHistory();

        return;

      if (tab === "liked") {

        renderLiked();

        );

        button.innerHTML = `
          <i class="fa-solid fa-video"></i>
          <span>Video</span>
        `;

      } else {

        overlay.classList.add(
          "hidden"
        );

        overlay.classList.remove(
          "flex"
        );

        button.innerHTML = `
          <i class="fa-solid fa-headphones"></i>
          <span>Audio</span>
        `;

      }

    }


    /* =========================================================
       SPEED
    ========================================================= */

    function openSpeedModal() {

      document
        .getElementById(
          "speedModal"
        )
        .classList.remove(
          "hidden"
        );

      document
        .getElementById(
          "speedModal"
        )
        .classList.add(
          "flex"
        );

    }


    function closeSpeedModal() {

      const modal =
        document.getElementById(
          "speedModal"
        );

      modal.classList.add(
        "hidden"
      );

      modal.classList.remove(
        "flex"
      );

    }


    function setPlaybackSpeed(
      speed
    ) {

      if (youtubePlayer) {

        try {

          youtubePlayer.setPlaybackRate(
            speed
          );

        } catch {}

      }

      closeSpeedModal();

      showToast(
        `Playback speed: ${speed}x`
      );

    }


    /* =========================================================
       SLEEP TIMER
    ========================================================= */

    function openSleepModal() {

      const modal =
        document.getElementById(
          "sleepModal"
        );

      modal.classList.remove(
        "hidden"
      );

      modal.classList.add(
        "flex"
      );

    }


    function closeSleepModal() {

      const modal =
        document.getElementById(
          "sleepModal"
        );

      modal.classList.add(
        "hidden"
      );

      modal.classList.remove(
        "flex"
      );

    }


    function setSleepTimer(
      minutes
    ) {

      clearTimeout(
        sleepTimer
      );

      sleepTimer =
        setTimeout(
          () => {

            try {

              youtubePlayer.pauseVideo();

            } catch {}

            showToast(
              "Sleep timer finished"
            );

          },
          minutes * 60 * 1000
        );

      closeSleepModal();

      showToast(
        `Sleep timer set for ${minutes} minutes`
      );

    }


    function cancelSleepTimer() {

      clearTimeout(
        sleepTimer
      );

      sleepTimer = null;

      closeSleepModal();

      showToast(
        "Sleep timer cancelled"
      );

    }


    /* =========================================================
       SHARE
    ========================================================= */

    async function shareCurrentVideo() {

      if (!currentVideo) return;

      const url =
        SITE_URL +
        "?v=" +
        encodeURIComponent(
          currentVideo.id
        );

      const shareData = {

        title:
          currentVideo.title,

        text:
          `Watch "${currentVideo.title}" on SKPlayer`,

        url

      };

      if (
        navigator.share
      ) {

        try {

          await navigator.share(
            shareData
          );

          return;

        } catch {}

      }

      try {

        await navigator.clipboard.writeText(
          url
        );

        showToast(
          "SKPlayer link copied"
        );

      } catch {

        showToast(
          url
        );

      }

    }


    /* =========================================================
       PIP
    ========================================================= */

    async function togglePiP() {

      /*
        The YouTube iframe itself cannot always be placed
        into native browser PiP from this page because the
        video is cross-origin.

        We provide a graceful fallback.
      */

      showToast(
        "PiP depends on browser and YouTube support"
      );

    }


    /* =========================================================
       VIDEO MENU
    ========================================================= */

    function showVideoMenu(
      index
    ) {

      const video =
        loadedVideos[index];

      if (!video) return;

      const action =
        prompt(
          `Choose action:\n\n1. Like\n2. Add to playlist\n3. Share`
        );

      if (action === "1") {

        const existing =
          likedVideos.findIndex(
            item =>
              item.id ===
              video.id
          );

        if (existing >= 0) {

          likedVideos.splice(
            existing,
            1
          );

          showToast(
            "Removed from liked videos"
          );

        } else {

          likedVideos.unshift(
            video
          );

          showToast(
            "Added to liked videos"
          );

        }

        saveState();

      } else if (
        action === "2"
      ) {

        currentVideo =
          video;

        addCurrentToPlaylist();

      } else if (
        action === "3"
      ) {

        currentVideo =
          video;

        shareCurrentVideo();

      }

    }


    /* =========================================================
       VOICE SEARCH
    ========================================================= */

    function startVoiceSearch() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        showToast(
          "Voice search is not supported in this browser"
        );

        return;

      }

      const modal =
        document.getElementById(
          "voiceModal"
        );

      modal.classList.remove(
        "hidden"
      );

      modal.classList.add(
        "flex"
      );

      const recognition =
        new SpeechRecognition();

      recognition.lang =
        "hi-IN";

      recognition.interimResults =
        false;

      recognition.maxAlternatives =
        1;

      recognition.onresult =
        event => {

          const transcript =
            event.results[0][0]
              .transcript;

          document.getElementById(
            "voiceText"
          ).textContent =
            transcript;

          setTimeout(
            () => {

              closeVoiceModal();

              searchYouTube(
                transcript
              );

            },
            400
          );

        };

      recognition.onerror =
        () => {

          closeVoiceModal();

          showToast(
            "Voice search failed"
          );

        };

      recognition.onend =
        () => {

          setTimeout(
            () => {

              const modal =
                document.getElementById(
                  "voiceModal"
                );

              if (
                !modal.classList.contains(
                  "hidden"
                )
              ) {
                closeVoiceModal();
              }

            },
            1000
          );

        };

      recognition.start();

    }


    function closeVoiceModal() {

      const modal =
        document.getElementById(
          "voiceModal"
        );

      modal.classList.add(
        "hidden"
      );

      modal.classList.remove(
        "flex"
      );

    }


    /* =========================================================
       INITIAL LOAD
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        getTrendingVideos();

        /*
          Deep link support:
          /skplayer/?v=VIDEO_ID
        */

        const params =
          new URLSearchParams(
            window.location.search
          );

        const videoId =
          params.get("v");

        if (videoId) {

          setTimeout(
            async () => {

              try {

                const videos =
                  await getVideoDetails(
                    [videoId]
                  );

                if (
                  videos.length
                ) {

                  loadedVideos =
                    videos.map(
                      normalizeVideo
                    );

                  openVideo(0);

                }

              } catch {}

            },
            1200
          );

        }

      }
    );


    /* =========================================================
       INFINITE SCROLL
    ========================================================= */

    window.addEventListener(
      "scroll",
      () => {

        if (
          activeTab !==
          "home"
        ) {
          return;
        }

        const nearBottom =
          window.innerHeight +
            window.scrollY >=
          document.body.offsetHeight -
            900;

        if (
          nearBottom &&
          nextPageToken &&
          !isLoading
        ) {

          loadMore();

        }

      }
    );

  </script>
