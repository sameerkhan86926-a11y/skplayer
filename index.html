<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKPlayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white font-sans antialiased pb-12 select-none">

    <!-- Top Header -->
    <header class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur-md px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-black text-sm shadow-lg shadow-red-600/30">SK</div>
            <span class="text-lg font-bold tracking-tight">SK<span class="text-red-500">Player</span></span>
        </div>
        <span class="text-xs font-semibold px-2 py-0.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-full">Ad-Free</span>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-4">
        <!-- Search Field -->
        <div class="relative flex items-center mb-5">
            <input id="searchInput" type="text" placeholder="Search any YouTube video..." 
                   class="w-full bg-[#1e1e1e] text-sm text-zinc-100 placeholder-zinc-500 pl-4 pr-12 py-3 rounded-full border border-zinc-800 focus:outline-none focus:border-red-500 transition">
            <button onclick="handleSearch()" class="absolute right-1.5 w-9 h-9 bg-red-600 rounded-full flex items-center justify-center text-white">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </button>
        </div>

        <!-- Video Player Section -->
        <div id="playerSection" class="hidden mb-6">
            <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
                <video id="mainVideo" controls autoplay playsinline class="w-full h-full object-contain"></video>
            </div>
            <h1 id="playingTitle" class="text-base font-semibold mt-3 line-clamp-2"></h1>
            <p id="playerStatus" class="text-xs text-red-400 mt-1"></p>
        </div>

        <!-- Feed Status / Heading -->
        <h2 id="feedHeading" class="text-sm font-semibold text-zinc-400 mb-3 uppercase tracking-wider">Top Videos</h2>

        <!-- Video Grid -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </main>

    <script>
        // Multi-instance list taaki koi ek down ho toh doosra pick ho sake
        const SERVERS = [
            "https://pipedapi.kavin.rocks",
            "https://api.piped.privacydev.net",
            "https://pipedapi.tokhmi.xyz",
            "https://piped-api.lunar.icu"
        ];

        let currentServerIndex = 0;

        async function fetchWithFallback(endpoint) {
            for (let i = 0; i < SERVERS.length; i++) {
                const base = SERVERS[(currentServerIndex + i) % SERVERS.length];
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 6000);
                    
                    const res = await fetch(`${base}${endpoint}`, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (res.ok) {
                        currentServerIndex = (currentServerIndex + i) % SERVERS.length;
                        return await res.json();
                    }
                } catch (e) {
                    console.warn(`Server ${base} unreachable, trying next...`);
                }
            }
            throw new Error("All servers down");
        }

        const searchInput = document.getElementById('searchInput');
        const videoGrid = document.getElementById('videoGrid');
        const playerSec = document.getElementById('playerSection');
        const mainVideo = document.getElementById('mainVideo');
        const playingTitle = document.getElementById('playingTitle');
        const playerStatus = document.getElementById('playerStatus');

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        async function handleSearch() {
            const q = searchInput.value.trim();
            if (!q) return;

            document.getElementById('feedHeading').innerText = `Results for "${q}"`;
            videoGrid.innerHTML = `
                <div class="col-span-full py-12 flex justify-center items-center text-zinc-400 gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Searching videos...
                </div>`;

            try {
                const data = await fetchWithFallback(`/search?q=${encodeURIComponent(q)}&filter=videos`);
                renderList(data.items || []);
            } catch (err) {
                videoGrid.innerHTML = `
                    <div class="col-span-full text-center py-8">
                        <p class="text-red-400 text-sm mb-2">Search network busy. Retrying alternate route...</p>
                        <button onclick="handleSearch()" class="px-4 py-1.5 bg-red-600 rounded-lg text-xs font-semibold">Try Again</button>
                    </div>`;
            }
        }

        async function loadInitialFeed() {
            videoGrid.innerHTML = `
                <div class="col-span-full py-12 flex justify-center items-center text-zinc-400 gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Loading SKPlayer...
                </div>`;
            try {
                const data = await fetchWithFallback(`/trending?region=IN`);
                renderList(data);
            } catch (err) {
                // Agar trending block ho, fallback search
                handleAutoFallback();
            }
        }

        async function handleAutoFallback() {
            try {
                const data = await fetchWithFallback(`/search?q=new+music&filter=videos`);
                renderList(data.items || []);
            } catch (e) {
                videoGrid.innerHTML = `<p class="col-span-full text-center text-zinc-500 py-8 text-xs">Search using the top bar</p>`;
            }
        }

        function renderList(items) {
            if (!items || items.length === 0) {
                videoGrid.innerHTML = `<p class="col-span-full text-center text-zinc-400 py-6 text-sm">No videos found.</p>`;
                return;
            }

            videoGrid.innerHTML = items.map(item => {
                const vidId = item.url ? item.url.replace('/watch?v=', '') : '';
                if (!vidId) return '';
                return `
                    <div onclick="playStream('${vidId}', '${encodeURIComponent(item.title)}')" class="bg-[#181818] rounded-xl overflow-hidden cursor-pointer hover:bg-zinc-800 transition active:scale-[0.98]">
                        <img src="${item.thumbnail}" class="w-full aspect-video object-cover" loading="lazy" onerror="this.src='https://placehold.co/640x360/181818/FFF?text=Video'">
                        <div class="p-3">
                            <h3 class="text-sm font-medium line-clamp-2">${item.title}</h3>
                            <p class="text-xs text-zinc-400 mt-1">${item.uploaderName || 'YouTube'}</p>
                        </div>
                    </div>`;
            }).join('');
        }

        async function playStream(id, title) {
            playerSec.classList.remove('hidden');
            playingTitle.innerText = decodeURIComponent(title);
            playerStatus.innerText = "Extracting ad-free stream...";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                const data = await fetchWithFallback(`/streams/${id}`);
                const stream = data.videoStreams?.find(s => s.quality === "720p" && !s.videoOnly) 
                             || data.videoStreams?.find(s => !s.videoOnly)
                             || data.videoStreams?.[0];

                if (stream && stream.url) {
                    mainVideo.src = stream.url;
                    playerStatus.innerText = "";
                    mainVideo.play();
                } else {
                    playerStatus.innerText = "Stream unavailable for this video.";
                }
            } catch (e) {
                playerStatus.innerText = "Stream extraction failed. Please try another video.";
            }
        }

        loadInitialFeed();
    </script>
</body>
</html>
