<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="description" content="SKPlayer Pro - Ad-Free Mobile Optimized Streaming Engine" />
  <title>SKPlayer Pro</title>

  <link rel="icon" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            ytBlack: "#0f0f0f",
            ytElevated: "#212121",
            ytPill: "#272727",
            ytPillHover: "#3f3f3f",
            ytBorder: "#272727",
            ytRed: "#ff0000"
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    body {
      background-color: #0f0f0f;
      color: #f1f1f1;
      font-family: 'Roboto', Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0f0f0f; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 9999px; }

    .chip-active {
      background-color: #ffffff !important;
      color: #0f0f0f !important;
      font-weight: 600;
    }

    .sidebar-active {
      background-color: #272727 !important;
      font-weight: 600;
      color: #ffffff !important;
    }

    .shimmer {
      background: linear-gradient(90deg, #181818 25%, #252525 50%, #181818 75%);
      background-size: 200% 100%;
      animation: shimmerAnim 1.4s infinite;
    }

    @keyframes shimmerAnim {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .sidebar-mini { width: 72px !important; }
    .sidebar-mini .sidebar-label,
    .sidebar-mini .sidebar-section-title { display: none !important; }
    .sidebar-mini .sidebar-item { justify-content: center !important; padding: 12px 0 !important; }

    /* Single Clean Compact Floating Window */
    .mini-pip-window {
      position: fixed !important;
      bottom: 68px !important;
      right: 12px !important;
      width: 210px !important;
      height: 118px !important;
      z-index: 999 !important;
      border: 2px solid #ff0000 !important;
      border-radius: 14px !important;
      box-shadow: 0 12px 30px rgba(0,0,0,0.95) !important;
      overflow: hidden !important;
    }

    @media (max-width: 767px) {
      body { padding-bottom: 74px; }
    }
  </style>
</head>

<body class="overflow-x-hidden selection:bg-ytRed selection:text-white">

  <!-- ==================== SPLASH ==================== -->
  <div id="splash" class="fixed inset-0 z-[9999] bg-ytBlack flex items-center justify-center transition-opacity duration-300">
    <div class="flex flex-col items-center">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center text-3xl font-black text-white shadow-2xl animate-pulse">
        SK
      </div>
      <div class="text-2xl font-bold tracking-tight mt-4">
        <span>SK</span><span class="text-ytRed">Player</span>
      </div>
      <div class="text-xs text-zinc-500 mt-1 font-medium">Auto-Play Engine Active</div>
    </div>
  </div>

  <!-- ==================== HEADER ==================== -->
  <header class="fixed top-0 left-0 right-0 h-14 bg-ytBlack/95 backdrop-blur-md border-b border-ytBorder z-40 px-3 md:px-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button onclick="toggleSidebar()" class="hidden md:flex w-10 h-10 rounded-full hover:bg-ytPill items-center justify-center text-zinc-300 transition" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars text-base"></i>
      </button>

      <button onclick="goHome()" class="flex items-center gap-2 group">
        <div class="w-7 h-7 rounded-lg bg-red-600 flex items-center justify-center font-black text-xs text-white shadow-md shadow-red-600/30">SK</div>
        <span class="text-lg font-bold tracking-tight text-white flex items-center">
          SK<span class="text-ytRed">Player</span>
          <span class="ml-1 text-[8px] font-extrabold uppercase tracking-wider text-red-400 bg-red-600/15 border border-red-500/25 px-1 py-0.5 rounded">Pro</span>
        </span>
      </button>
    </div>

    <!-- Desktop Search Bar -->
    <div class="relative hidden md:flex flex-1 max-w-xl mx-6 items-center gap-3">
      <div class="flex w-full h-10 bg-[#121212] border border-[#303030] rounded-full overflow-hidden focus-within:border-red-500 transition">
        <input id="searchInput" type="search" placeholder="Search songs, artists..." autocomplete="off"
               class="flex-1 bg-transparent px-5 text-sm text-zinc-100 placeholder-zinc-500 outline-none"
               oninput="handleSearchSuggest(this.value, 'desktop')"
               onkeydown="handleSearchKey(event)" />
        <button onclick="performSearch()" class="w-14 bg-ytPill flex items-center justify-center text-zinc-300">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </button>
      </div>
      <div id="desktopSuggestions" class="hidden absolute top-12 left-0 right-14 bg-[#1e1e1e] border border-zinc-800 rounded-2xl p-2 shadow-2xl z-50"></div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-1.5">
      <button onclick="openMobileSearch()" class="md:hidden w-9 h-9 rounded-full bg-ytPill flex items-center justify-center text-zinc-300" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </button>

      <button onclick="startVoiceSearch()" class="w-9 h-9 rounded-full bg-ytPill flex items-center justify-center text-zinc-300 active:scale-95 transition" aria-label="Voice">
        <i class="fa-solid fa-microphone text-sm"></i>
      </button>

      <button onclick="toggleAudioMode()" id="headerAudioBtn" class="flex items-center gap-1 px-2.5 h-8 rounded-full bg-ytPill text-xs font-semibold border border-zinc-700/60">
        <i class="fa-solid fa-headphones text-red-500 text-xs"></i>
        <span class="text-[11px]">Audio</span>
      </button>

      <button onclick="openPlaylistModal()" class="w-8 h-8 rounded-full bg-ytPill flex items-center justify-center text-zinc-300 ml-0.5" title="Playlists">
        <i class="fa-solid fa-folder-plus text-xs"></i>
      </button>
    </div>
  </header>

  <!-- ==================== MOBILE SEARCH OVERLAY ==================== -->
  <div id="mobileSearch" class="hidden fixed inset-0 z-50 bg-ytBlack flex flex-col p-3">
    <div class="flex items-center gap-2 pb-2 border-b border-ytBorder">
      <button onclick="closeMobileSearch()" class="w-9 h-9 rounded-full hover:bg-ytPill flex items-center justify-center text-zinc-300">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <input id="mobileSearchInput" class="flex-1 h-10 bg-[#181818] rounded-full px-4 text-sm text-white placeholder-zinc-500 outline-none border border-zinc-700 focus:border-red-500" placeholder="Search songs, artists..." oninput="handleSearchSuggest(this.value, 'mobile')" onkeydown="handleMobileSearchKey(event)" />
      <button onclick="performMobileSearch()" class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center text-white shrink-0">
        <i class="fa-solid fa-magnifying-glass text-sm"></i>
      </button>
    </div>
    <div id="mobileSuggestions" class="mt-2 space-y-1 overflow-y-auto"></div>
  </div>

  <!-- ==================== VOICE MODAL ==================== -->
  <div id="voiceModal" class="hidden fixed inset-0 z-[100] bg-black/85 backdrop-blur-sm items-center justify-center p-5">
    <div class="w-full max-w-xs bg-[#212121] rounded-3xl p-6 text-center border border-zinc-800 shadow-2xl">
      <div class="w-16 h-16 rounded-full bg-red-600 mx-auto flex items-center justify-center text-2xl text-white animate-pulse">
        <i class="fa-solid fa-microphone"></i>
      </div>
      <h3 class="text-base font-bold mt-4 text-white">Listening...</h3>
      <p id="voiceText" class="text-zinc-400 text-xs mt-1">Boliye gaana ya channel...</p>
      <button onclick="closeVoiceModal()" class="mt-5 px-5 py-1.5 rounded-full bg-ytPill text-xs font-semibold">Cancel</button>
    </div>
  </div>

  <!-- ==================== PLAYLIST MODAL ==================== -->
  <div id="playlistModal" class="hidden fixed inset-0 z-[120] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[#212121] w-full max-w-sm rounded-3xl p-4 border border-zinc-800 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-folder-plus text-red-500"></i> Playlist
        </h3>
        <button onclick="closePlaylistModal()" class="w-7 h-7 rounded-full hover:bg-ytPill flex items-center justify-center text-zinc-400"><i class="fa-solid fa-xmark text-sm"></i></button>
      </div>

      <div id="modalPlaylistItems" class="max-h-52 overflow-y-auto space-y-2 my-2"></div>

      <div class="pt-2 border-t border-zinc-800 mt-2">
        <div class="flex gap-2">
          <input id="newPlaylistInput" type="text" placeholder="Playlist name..." class="flex-1 bg-[#141414] border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 outline-none" />
          <button onclick="handleModalCreatePlaylist()" class="px-3 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-semibold transition">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== SIDEBAR (DESKTOP) ==================== -->
  <aside id="sidebar" class="fixed left-0 top-14 bottom-0 w-60 bg-ytBlack border-r border-ytBorder z-30 overflow-y-auto hidden md:block transition-all duration-200">
    <div class="p-3 space-y-1">
      <button class="sidebar-item sidebar-active w-full flex items-center gap-6 rounded-xl px-4 py-2.5 text-sm text-zinc-200 hover:bg-ytPill transition" data-tab="home" onclick="switchMainTab('home')">
        <i class="fa-solid fa-house text-base w-5 text-center"></i>
        <span class="sidebar-label">Home</span>
      </button>
      <button class="sidebar-item w-full flex items-center gap-6 rounded-xl px-4 py-2.5 text-sm text-zinc-300 hover:bg-ytPill transition" data-tab="shorts" onclick="switchMainTab('shorts')">
        <i class="fa-solid fa-bolt text-base w-5 text-center text-red-500"></i>
        <span class="sidebar-label">Shorts</span>
      </button>
      <button class="sidebar-item w-full flex items-center gap-6 rounded-xl px-4 py-2.5 text-sm text-zinc-300 hover:bg-ytPill transition" data-tab="subscriptions" onclick="switchMainTab('subscriptions')">
        <i class="fa-solid fa-layer-group text-base w-5 text-center"></i>
        <span class="sidebar-label">Subscriptions</span>
      </button>

      <div class="border-t border-ytBorder/80 my-3"></div>

      <div class="sidebar-section-title px-4 py-1.5 text-[11px] font-bold text-zinc-400 uppercase tracking-wider">Library</div>
      <button class="sidebar-item w-full flex items-center gap-6 rounded-xl px-4 py-2.5 text-sm text-zinc-300 hover:bg-ytPill transition" data-tab="history" onclick="switchMainTab('history')">
        <i class="fa-solid fa-clock-rotate-left text-base w-5 text-center"></i>
        <span class="sidebar-label">History</span>
      </button>
      <button class="sidebar-item w-full flex items-center gap-6 rounded-xl px-4 py-2.5 text-sm text-zinc-300 hover:bg-ytPill transition" data-tab="library" onclick="switchMainTab('library')">
        <i class="fa-solid fa-folder text-base w-5 text-center"></i>
        <span class="sidebar-label">Playlists</span>
      </button>
      <button class="sidebar-item w-full flex items-center gap-6 rounded-xl px-4 py-2.5 text-sm text-zinc-300 hover:bg-ytPill transition" data-tab="liked" onclick="switchMainTab('liked')">
        <i class="fa-solid fa-thumbs-up text-base w-5 text-center"></i>
        <span class="sidebar-label">Liked videos</span>
      </button>
    </div>
  </aside>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main id="mainContent" class="pt-14 md:pl-60 transition-all duration-200">
    <div id="categoryBar" class="sticky top-14 z-20 bg-ytBlack/95 backdrop-blur-md border-b border-ytBorder/60">
      <div id="categoryScroller" class="flex gap-2 px-3 md:px-6 py-2 overflow-x-auto no-scrollbar">
        <button class="chip chip-active px-3 py-1.5 rounded-lg bg-ytPill text-xs font-semibold whitespace-nowrap" onclick="quickFilter('Trending Songs India', this)">All</button>
        <button class="chip px-3 py-1.5 rounded-lg bg-ytPill text-xs font-medium whitespace-nowrap" onclick="quickFilter('Bollywood Songs', this)">Bollywood</button>
        <button class="chip px-3 py-1.5 rounded-lg bg-ytPill text-xs font-medium whitespace-nowrap" onclick="quickFilter('Punjabi Hits', this)">Punjabi</button>
        <button class="chip px-3 py-1.5 rounded-lg bg-ytPill text-xs font-medium whitespace-nowrap" onclick="quickFilter('Arijit Singh Hits', this)">Arijit Singh</button>
        <button class="chip px-3 py-1.5 rounded-lg bg-ytPill text-xs font-medium whitespace-nowrap" onclick="quickFilter('Lo-Fi Relax Songs', this)">Lo-Fi</button>
        <button class="chip px-3 py-1.5 rounded-lg bg-ytPill text-xs font-medium whitespace-nowrap" onclick="quickFilter('Hindi Podcasts', this)">Podcasts</button>
      </div>
    </div>

    <div id="app" class="px-3 md:px-6 py-4"></div>
  </main>

  <!-- ==================== MOBILE BOTTOM NAV ==================== -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-ytBlack/98 backdrop-blur-md border-t border-ytBorder">
    <div class="h-14 flex items-center justify-around px-2">
      <button onclick="switchMainTab('home')" class="flex flex-col items-center gap-1 text-[10px] text-zinc-300 hover:text-white">
        <i class="fa-solid fa-house text-base"></i>
        <span>Home</span>
      </button>
      <button onclick="switchMainTab('shorts')" class="flex flex-col items-center gap-1 text-[10px] text-zinc-300 hover:text-white">
        <i class="fa-solid fa-bolt text-base text-red-500"></i>
        <span>Shorts</span>
      </button>
      <button onclick="switchMainTab('subscriptions')" class="flex flex-col items-center gap-1 text-[10px] text-zinc-300 hover:text-white">
        <i class="fa-solid fa-layer-group text-base"></i>
        <span>Subs</span>
      </button>
      <button onclick="switchMainTab('library')" class="flex flex-col items-center gap-1 text-[10px] text-zinc-300 hover:text-white">
        <i class="fa-solid fa-folder text-base"></i>
        <span>You</span>
      </button>
    </div>
  </nav>

  <!-- ==================== SINGLE TRUE PLAYER SYSTEM ==================== -->
  <!-- Yeh Player Box Cinema me bhi fit rehta hai aur Dock hone par ek chhota floating box ban jata hai -->
  <div id="playerBox" class="hidden fixed z-[60] bg-black rounded-xl overflow-hidden shadow-2xl border border-zinc-800 transition-all duration-300">
    <div id="streamFrameContainer" class="w-full h-full relative">
      <!-- Player will mount here dynamically -->
    </div>

    <!-- Mini Floating Controls Bar (Shows only when Mini-Docked) -->
    <div id="miniDockOverlayControls" class="hidden absolute top-1 right-1 z-30 flex items-center gap-1">
      <button onclick="restoreFromDock()" class="w-7 h-7 rounded-full bg-black/80 text-white flex items-center justify-center text-[10px]" title="Full Screen">
        <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
      </button>
      <button onclick="closePlayerEntirely()" class="w-7 h-7 rounded-full bg-black/80 text-white hover:text-red-500 flex items-center justify-center text-xs" title="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div id="audioOverlay" class="hidden absolute inset-0 bg-black/95 flex flex-col items-center justify-center gap-2 z-20">
      <i class="fa-solid fa-headphones text-red-500 text-3xl animate-pulse"></i>
      <p class="text-xs font-semibold text-zinc-200">Pure Audio Mode (Zero Ads)</p>
    </div>
  </div>

  <!-- ==================== CINEMA WATCH VIEW ==================== -->
  <div id="watchView" class="hidden fixed inset-0 z-50 bg-ytBlack overflow-y-auto">
    <div class="max-w-[1700px] mx-auto">
      <div class="sticky top-0 z-30 h-12 md:h-14 bg-ytBlack/95 backdrop-blur-md border-b border-ytBorder flex items-center justify-between px-3">
        <div class="flex items-center gap-2">
          <!-- Slide Down to Mini Player Button -->
          <button onclick="minimizeToFloatingDock()" class="w-9 h-9 rounded-full hover:bg-ytPill flex items-center justify-center text-zinc-300" title="Minimize / Slide Down">
            <i class="fa-solid fa-chevron-down text-sm"></i>
          </button>
          <span class="font-bold text-xs md:text-sm text-white">Ad-Free Stream</span>
        </div>

        <div class="flex items-center gap-1">
          <button onclick="minimizeToFloatingDock()" class="w-9 h-9 rounded-full bg-red-600/20 hover:bg-red-600/30 text-red-400 flex items-center justify-center transition" title="Floating Window">
            <i class="fa-solid fa-down-left-and-up-right-to-center text-xs"></i>
          </button>
          <button onclick="shareCurrentVideo()" class="w-9 h-9 rounded-full hover:bg-ytPill flex items-center justify-center text-zinc-300">
            <i class="fa-solid fa-share-nodes text-sm"></i>
          </button>
        </div>
      </div>

      <div class="p-2 md:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,2.3fr)_minmax(340px,1fr)] gap-4">
          <section id="playerContainer" class="flex flex-col">
            <!-- Space Holder where PlayerBox sits in Full View -->
            <div id="cinemaHolder" class="w-full aspect-video rounded-xl overflow-hidden bg-black"></div>

            <!-- Video Details -->
            <div class="mt-3 px-1">
              <h1 id="watchTitle" class="text-sm md:text-lg font-bold leading-snug text-white">Loading...</h1>

              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mt-3 pb-3 border-b border-ytBorder/60">
                <div class="flex items-center justify-between sm:justify-start gap-3">
                  <div class="flex items-center gap-2">
                    <div id="watchChannelAvatar" class="w-9 h-9 rounded-full bg-red-600 flex items-center justify-center font-bold text-xs uppercase text-white shadow-md">S</div>
                    <div>
                      <div id="watchChannel" class="font-semibold text-xs md:text-sm text-zinc-100 flex items-center gap-1">
                        <span>Channel</span>
                        <i class="fa-solid fa-circle-check text-[9px] text-zinc-400"></i>
                      </div>
                      <div class="text-[10px] text-zinc-400">SK Verified</div>
                    </div>
                  </div>
                  <button id="subscribeBtn" onclick="toggleSubscribe()" class="px-3.5 py-1.5 rounded-full bg-white text-black font-semibold text-xs">Subscribe</button>
                </div>

                <!-- Complete Action Bar -->
                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar text-xs py-1">
                  <button id="likeBtn" onclick="toggleLikeCurrent()" class="px-3 py-1.5 rounded-full bg-ytPill flex items-center gap-1 whitespace-nowrap">
                    <i class="fa-regular fa-thumbs-up"></i>
                    <span id="likeCount">Like</span>
                  </button>

                  <button onclick="minimizeToFloatingDock()" class="px-3 py-1.5 rounded-full bg-red-600 text-white flex items-center gap-1 whitespace-nowrap font-medium">
                    <i class="fa-solid fa-tv text-xs"></i>
                    <span>Mini Dock</span>
                  </button>

                  <button onclick="openPlaylistModal()" class="px-3 py-1.5 rounded-full bg-ytPill flex items-center gap-1 whitespace-nowrap">
                    <i class="fa-solid fa-folder-plus text-amber-400"></i>
                    <span>Save</span>
                  </button>

                  <button onclick="toggleAudioMode()" class="px-3 py-1.5 rounded-full bg-ytPill flex items-center gap-1 whitespace-nowrap">
                    <i class="fa-solid fa-headphones text-red-500"></i>
                    <span>Audio</span>
                  </button>

                  <button onclick="openSleepModal()" class="px-3 py-1.5 rounded-full bg-ytPill whitespace-nowrap">Sleep</button>
                </div>
              </div>

              <div id="watchDescription" class="mt-3 p-3 bg-[#181818] rounded-xl text-xs leading-relaxed text-zinc-300 border border-ytBorder/40">
                Loading description...
              </div>

              <div class="mt-5">
                <div class="flex items-center gap-2 mb-3">
                  <h2 class="text-sm font-bold text-white">Comments</h2>
                  <span id="commentCount" class="text-xs text-zinc-400"></span>
                </div>
                <div id="comments" class="space-y-3"></div>
              </div>
            </div>
          </section>

          <aside class="flex flex-col mt-4 lg:mt-0">
            <h2 class="font-bold text-xs text-zinc-300 mb-2">Up Next</h2>
            <div id="upNext" class="space-y-2"></div>
          </aside>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== SHORTS VIEW ==================== -->
  <div id="shortsView" class="hidden fixed inset-0 z-50 bg-black overflow-y-auto">
    <div class="sticky top-0 z-20 h-12 bg-black/90 backdrop-blur-md flex items-center px-3 border-b border-zinc-800">
      <button onclick="closeShortsView()" class="w-8 h-8 rounded-full hover:bg-ytPill flex items-center justify-center text-zinc-300">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </button>
      <span class="font-bold text-sm ml-2 text-white">Shorts</span>
    </div>
    <div id="shortsContainer" class="flex flex-col items-center gap-6 py-4"></div>
  </div>

  <!-- ==================== SLEEP MODAL ==================== -->
  <div id="sleepModal" class="hidden fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm items-center justify-center p-3">
    <div class="bg-[#212121] w-full max-w-xs rounded-3xl p-4 border border-zinc-800 shadow-2xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-xs text-white">Sleep Timer</h3>
        <button onclick="closeSleepModal()" class="w-7 h-7 rounded-full hover:bg-ytPill flex items-center justify-center text-zinc-400"><i class="fa-solid fa-xmark text-sm"></i></button>
      </div>
      <div class="grid grid-cols-2 gap-2 text-xs font-medium">
        <button onclick="setSleepTimer(10)" class="p-2.5 rounded-xl bg-ytPill text-left">10 min</button>
        <button onclick="setSleepTimer(20)" class="p-2.5 rounded-xl bg-ytPill text-left">20 min</button>
        <button onclick="setSleepTimer(30)" class="p-2.5 rounded-xl bg-ytPill text-left">30 min</button>
        <button onclick="setSleepTimer(60)" class="p-2.5 rounded-xl bg-ytPill text-left">60 min</button>
        <button onclick="cancelSleepTimer()" class="col-span-2 p-2 rounded-xl bg-red-600/30 text-red-400 font-semibold text-center">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ==================== NOTIFICATION TOAST ==================== -->
  <div id="toast" class="hidden fixed bottom-16 md:bottom-8 left-1/2 -translate-x-1/2 z-[200] bg-[#323232] text-white text-[11px] px-4 py-2 rounded-full shadow-2xl border border-zinc-700/60 font-medium"></div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const API_KEY = "AIzaSyBeFQ9lfxdr5nAY1F4yLlt-GaPIAruDPKY";
    const SITE_URL = window.location.origin + window.location.pathname;

    let currentQuery = "Trending Songs India";
    let loadedVideos = [];
    let currentVideo = null;
    let currentVideoIndex = 0;
    let isFloatingDock = false;
    let sidebarMini = false;
    let audioMode = false;
    let sleepTimer = null;
    let nextPageToken = "";
    let isLoading = false;
    let activeTab = "home";
    let ytPlayer = null;

    let subscriptions = JSON.parse(localStorage.getItem("skplayer_subscriptions") || "[]");
    let likedVideos = JSON.parse(localStorage.getItem("skplayer_liked") || "[]");
    let history = JSON.parse(localStorage.getItem("skplayer_history") || "[]");
    let playlists = JSON.parse(localStorage.getItem("skplayer_playlists") || "[]");

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatNumber(number) {
      const n = Number(number || 0);
      if (n >= 1000000000) return (n / 1000000000).toFixed(1) + "B";
      if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
      if (n >= 1000) return (n / 1000).toFixed(1) + "K";
      return String(n);
    }

    function formatDuration(iso) {
      if (!iso) return "";
      const match = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return "";
      const hours = Number(match[1] || 0);
      const minutes = Number(match[2] || 0);
      const seconds = Number(match[3] || 0);
      return hours > 0 ? `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}` : `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function formatTimeAgo(dateString) {
      if (!dateString) return "";
      const date = new Date(dateString);
      const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
      if (seconds < 60) return "just now";
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      if (days < 30) return `${days}d ago`;
      const months = Math.floor(days / 30);
      if (months < 12) return `${months}mo ago`;
      return `${Math.floor(months / 12)}y ago`;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.classList.add("hidden"); }, 2200);
    }

    function saveState() {
      localStorage.setItem("skplayer_subscriptions", JSON.stringify(subscriptions));
      localStorage.setItem("skplayer_liked", JSON.stringify(likedVideos));
      localStorage.setItem("skplayer_history", JSON.stringify(history));
      localStorage.setItem("skplayer_playlists", JSON.stringify(playlists));
    }

    window.addEventListener("load", () => {
      setTimeout(() => {
        const splash = document.getElementById("splash");
        if (splash) {
          splash.style.opacity = "0";
          setTimeout(() => splash.remove(), 250);
        }
      }, 350);
    });

    function toggleSidebar() {
      if (window.innerWidth < 768) return;
      const sidebar = document.getElementById("sidebar");
      const main = document.getElementById("mainContent");
      sidebarMini = !sidebarMini;
      if (sidebarMini) {
        sidebar.classList.add("sidebar-mini");
        sidebar.classList.remove("w-60");
        main.classList.remove("md:pl-60");
        main.classList.add("md:pl-[72px]");
      } else {
        sidebar.classList.remove("sidebar-mini");
        sidebar.classList.add("w-60");
        main.classList.remove("md:pl-[72px]");
        main.classList.add("md:pl-60");
      }
    }

    async function youtubeFetch(endpoint, params = {}) {
      const url = new URL("https://www.googleapis.com/youtube/v3/" + endpoint);
      Object.entries({ ...params, key: API_KEY }).forEach(([key, value]) => {
        url.searchParams.set(key, value);
      });
      const response = await fetch(url.toString());
      if (!response.ok) {
        let msg = "Request failed.";
        try { const d = await response.json(); msg = d?.error?.message || msg; } catch {}
        throw new Error(msg);
      }
      return response.json();
    }

    async function getVideoDetails(ids) {
      if (!ids.length) return [];
      const uniqueIds = [...new Set(ids)].slice(0, 50);
      const data = await youtubeFetch("videos", {
        part: "snippet,contentDetails,statistics",
        id: uniqueIds.join(",")
      });
      return data.items || [];
    }

    async function searchYouTube(query, append = false) {
      if (isLoading) return;
      isLoading = true;
      if (!append) renderSkeleton();
      try {
        const searchData = await youtubeFetch("search", {
          part: "snippet",
          type: "video",
          maxResults: 20,
          q: query,
          pageToken: append ? nextPageToken : ""
        });
        nextPageToken = searchData.nextPageToken || "";
        const ids = (searchData.items || []).map(item => item.id?.videoId).filter(Boolean);
        const details = await getVideoDetails(ids);
        const detailMap = new Map(details.map(item => [item.id, item]));

        const videos = (searchData.items || []).map(item => {
          const id = item.id?.videoId;
          const detail = detailMap.get(id);
          if (!id || !detail) return null;
          return normalizeVideo(detail);
        }).filter(Boolean);

        if (append) loadedVideos.push(...videos);
        else loadedVideos = videos;
        currentQuery = query;
        renderHome();
      } catch (error) {
        renderError(error.message || "Failed to load stream.");
      } finally {
        isLoading = false;
      }
    }

    async function getTrendingVideos() {
      if (isLoading) return;
      isLoading = true;
      renderSkeleton();
      try {
        const data = await youtubeFetch("videos", {
          part: "snippet,contentDetails,statistics",
          chart: "mostPopular",
          regionCode: "IN",
          maxResults: 20
        });
        loadedVideos = (data.items || []).map(normalizeVideo);
        currentQuery = "Trending Songs India";
        renderHome();
      } catch (error) {
        renderError(error.message || "Failed to fetch trending videos.");
      } finally {
        isLoading = false;
      }
    }

    function normalizeVideo(item) {
      return {
        id: item.id,
        title: item.snippet?.title || "Video",
        channelId: item.snippet?.channelId || "",
        channelTitle: item.snippet?.channelTitle || "Creator",
        thumbnail: item.snippet?.thumbnails?.high?.url || item.snippet?.thumbnails?.medium?.url || `https://i.ytimg.com/vi/${item.id}/hqdefault.jpg`,
        publishedAt: item.snippet?.publishedAt || "",
        description: item.snippet?.description || "",
        duration: formatDuration(item.contentDetails?.duration),
        views: Number(item.statistics?.viewCount || 0),
        likes: Number(item.statistics?.likeCount || 0)
      };
    }

    function renderHome() {
      activeTab = "home";
      updateSidebarState("home");
      const app = document.getElementById("app");
      if (!loadedVideos.length) {
        renderEmpty("No streams found", "Try another search.");
        return;
      }

      app.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-3">
            <div>
              <h1 class="text-base md:text-xl font-bold">${currentQuery === "Trending Songs India" ? "Trending Today" : "Search Results"}</h1>
              <p class="text-[11px] text-zinc-400">${escapeHTML(currentQuery)}</p>
            </div>
            <button onclick="refreshFeed()" class="w-8 h-8 rounded-full bg-ytPill flex items-center justify-center text-zinc-300">
              <i class="fa-solid fa-rotate text-xs"></i>
            </button>
          </div>
          <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6"></div>
          <div class="flex justify-center py-6">
            <button onclick="loadMore()" class="px-5 py-2 rounded-full bg-ytPill text-xs font-semibold">Load more</button>
          </div>
        </div>
      `;

      const grid = document.getElementById("videoGrid");
      loadedVideos.forEach((video, index) => {
        grid.insertAdjacentHTML("beforeend", createVideoCard(video, index));
      });
    }

    function createVideoCard(video, index) {
      const title = escapeHTML(video.title);
      const channel = escapeHTML(video.channelTitle);
      const views = formatNumber(video.views);
      const time = formatTimeAgo(video.publishedAt);
      const duration = escapeHTML(video.duration || "");
      const avatar = escapeHTML((video.channelTitle || "S").trim().charAt(0).toUpperCase());

      return `
        <article class="cursor-pointer group flex flex-col" onclick="openVideo(${index})">
          <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-[#181818]">
            <img src="${escapeHTML(video.thumbnail)}" alt="${title}" loading="lazy" class="w-full h-full object-cover" onerror="this.src='https://i.ytimg.com/vi/${video.id}/hqdefault.jpg'" />
            ${duration ? `<span class="absolute bottom-1.5 right-1.5 bg-black/85 text-white text-[10px] font-medium px-1.5 py-0.5 rounded">${duration}</span>` : ""}
          </div>
          <div class="flex gap-2.5 px-0.5 mt-2.5">
            <div class="shrink-0 w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-amber-600 flex items-center justify-center text-xs font-bold text-white">${avatar}</div>
            <div class="min-w-0 flex-1">
              <h3 class="font-semibold text-xs md:text-sm leading-snug line-clamp-2 text-zinc-100">${title}</h3>
              <p class="text-[11px] text-zinc-400 mt-0.5 truncate">${channel}</p>
              <p class="text-[10px] text-zinc-500">${views} views • ${time}</p>
            </div>
            <button onclick="event.stopPropagation(); openPlaylistModal(${index})" class="w-7 h-7 rounded-full hover:bg-ytPill flex items-center justify-center text-zinc-400 shrink-0">
              <i class="fa-solid fa-folder-plus text-xs"></i>
            </button>
          </div>
        </article>
      `;
    }

    function renderSkeleton() {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
          ${Array.from({ length: 6 }, () => `
            <div>
              <div class="aspect-video rounded-xl shimmer"></div>
              <div class="flex gap-2.5 mt-2">
                <div class="w-8 h-8 rounded-full shimmer shrink-0"></div>
                <div class="flex-1 space-y-1.5 mt-1">
                  <div class="h-3 rounded shimmer w-4/5"></div>
                  <div class="h-2.5 rounded shimmer w-3/5"></div>
                </div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderError(message) {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="min-h-[40vh] flex items-center justify-center text-center p-4">
          <div class="bg-[#181818] p-5 rounded-2xl border border-zinc-800 max-w-xs">
            <i class="fa-solid fa-triangle-exclamation text-red-500 text-2xl mb-2"></i>
            <h2 class="text-sm font-bold">Notice</h2>
            <p class="text-zinc-400 text-xs mt-1">${escapeHTML(message)}</p>
            <button onclick="refreshFeed()" class="mt-3 px-4 py-1.5 rounded-full bg-white text-black font-semibold text-xs">Retry</button>
          </div>
        </div>
      `;
    }

    function renderEmpty(title, description) {
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="min-h-[40vh] flex items-center justify-center text-center p-4">
          <div>
            <i class="fa-solid fa-video-slash text-zinc-600 text-2xl mb-2"></i>
            <h2 class="text-sm font-bold">${escapeHTML(title)}</h2>
            <p class="text-zinc-400 text-xs mt-1">${escapeHTML(description)}</p>
          </div>
        </div>
      `;
    }

    let suggestDebounce = null;
    function handleSearchSuggest(val, mode) {
      clearTimeout(suggestDebounce);
      const box = mode === "desktop" ? document.getElementById("desktopSuggestions") : document.getElementById("mobileSuggestions");
      if (!val.trim()) { box.classList.add("hidden"); return; }
      suggestDebounce = setTimeout(async () => {
        try {
          const res = await fetch(`https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=${encodeURIComponent(val)}`);
          const data = await res.json();
          const list = data[1] || [];
          if (!list.length) { box.classList.add("hidden"); return; }
          box.innerHTML = list.slice(0, 6).map(q => `
            <div onclick="selectSuggestion('${escapeHTML(q)}', '${mode}')" class="px-3 py-2 text-xs text-zinc-200 hover:bg-[#282828] rounded-xl cursor-pointer flex items-center gap-2">
              <i class="fa-solid fa-magnifying-glass text-[10px] text-zinc-500"></i>
              <span>${escapeHTML(q)}</span>
            </div>
          `).join("");
          box.classList.remove("hidden");
        } catch { box.classList.add("hidden"); }
      }, 200);
    }

    function selectSuggestion(query, mode) {
      if (mode === "desktop") {
        document.getElementById("searchInput").value = query;
        document.getElementById("desktopSuggestions").classList.add("hidden");
      } else {
        document.getElementById("mobileSearchInput").value = query;
        closeMobileSearch();
      }
      searchYouTube(query);
    }

    function handleSearchKey(event) {
      if (event.key === "Enter") {
        document.getElementById("desktopSuggestions").classList.add("hidden");
        performSearch();
      }
    }

    function performSearch() {
      const query = document.getElementById("searchInput").value.trim();
      if (!query) return;
      searchYouTube(query);
    }

    function handleMobileSearchKey(event) { if (event.key === "Enter") performMobileSearch(); }
    function performMobileSearch() {
      const query = document.getElementById("mobileSearchInput").value.trim();
      if (!query) return;
      closeMobileSearch();
      searchYouTube(query);
    }

    function openMobileSearch() {
      const modal = document.getElementById("mobileSearch");
      modal.classList.remove("hidden");
      setTimeout(() => document.getElementById("mobileSearchInput").focus(), 80);
    }

    function closeMobileSearch() {
      document.getElementById("mobileSearch").classList.add("hidden");
      document.getElementById("mobileSuggestions").classList.add("hidden");
    }

    function quickFilter(query, button) {
      document.querySelectorAll(".chip").forEach(el => el.classList.remove("chip-active"));
      if (button) button.classList.add("chip-active");
      searchYouTube(query);
    }

    async function loadMore() {
      if (!nextPageToken || isLoading) {
        showToast("No more results");
        return;
      }
      await searchYouTube(currentQuery, true);
    }

    function refreshFeed() {
      nextPageToken = "";
      if (currentQuery === "Trending Songs India") getTrendingVideos();
      else searchYouTube(currentQuery);
    }

    /* ==================== BULLET-PROOF AUTOPLAY & AD-FREE STREAM ==================== */
    function onYouTubeIframeAPIReady() {
      // API is ready
    }

    function loadActivePlayer(videoId) {
      const container = document.getElementById("streamFrameContainer");
      container.innerHTML = `<div id="ytPlayerFrame" class="w-full h-full"></div>`;

      // Native IFrame API for Guaranteed Continuous Auto-play Next Song
      ytPlayer = new YT.Player("ytPlayerFrame", {
        host: "https://www.youtube-nocookie.com",
        videoId: videoId,
        playerVars: {
          autoplay: 1,
          playsinline: 1,
          rel: 0,
          modestbranding: 1,
          iv_load_policy: 3,
          enablejsapi: 1,
          controls: 1,
          origin: window.location.origin
        },
        events: {
          onReady: (e) => {
            e.target.playVideo();
          },
          onStateChange: (e) => {
            // State 0 = ENDED -> Autoplay next track without stopping
            if (e.data === YT.PlayerState.ENDED) {
              playNextTrack();
            }
          }
        }
      });
    }

    function playNextTrack() {
      if (currentVideoIndex < loadedVideos.length - 1) {
        currentVideoIndex++;
        showToast("Autoplaying next song...");
        openVideo(currentVideoIndex);
      } else {
        showToast("Playlist complete");
      }
    }

    function openVideo(index) {
      const video = loadedVideos[index];
      if (!video) return;
      currentVideo = video;
      currentVideoIndex = index;
      addToHistory(video);

      // Restore full screen positioning
      restoreFromDock();

      document.getElementById("watchView").classList.remove("hidden");
      document.body.style.overflow = "hidden";

      updateWatchInfo(video);
      renderUpNext();
      loadActivePlayer(video.id);
      fetchComments(video.id);
      window.scrollTo(0, 0);
    }

    function updateWatchInfo(video) {
      document.getElementById("watchTitle").textContent = video.title;
      document.getElementById("watchChannel").textContent = video.channelTitle;
      document.getElementById("watchDescription").textContent = video.description || "No description.";
      document.getElementById("watchChannelAvatar").textContent = (video.channelTitle || "S").trim().charAt(0).toUpperCase();

      updateLikeButton();
      updateSubscribeButton();
      document.getElementById("commentCount").textContent = "";
    }

    /* Single Clean Compact Floating Window Logic */
    function minimizeToFloatingDock() {
      if (!currentVideo) return;
      const playerBox = document.getElementById("playerBox");
      const watchView = document.getElementById("watchView");
      const miniControls = document.getElementById("miniDockOverlayControls");

      isFloatingDock = true;
      watchView.classList.add("hidden");
      document.body.style.overflow = "";

      // Convert the main player into single floating window
      playerBox.classList.add("mini-pip-window");
      playerBox.classList.remove("hidden");
      miniControls.classList.remove("hidden");

      showToast("Floating mini dock active");
    }

    function restoreFromDock() {
      const playerBox = document.getElementById("playerBox");
      const cinemaHolder = document.getElementById("cinemaHolder");
      const miniControls = document.getElementById("miniDockOverlayControls");

      isFloatingDock = false;
      playerBox.classList.remove("mini-pip-window");
      miniControls.classList.add("hidden");

      // Dock player back into Cinema holder
      cinemaHolder.appendChild(playerBox);
      playerBox.classList.remove("hidden");
      playerBox.style.position = "relative";
      playerBox.style.width = "100%";
      playerBox.style.height = "100%";

      document.getElementById("watchView").classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closePlayerEntirely() {
      const playerBox = document.getElementById("playerBox");
      playerBox.classList.add("hidden");
      playerBox.classList.remove("mini-pip-window");
      document.getElementById("streamFrameContainer").innerHTML = "";
      if (ytPlayer && ytPlayer.destroy) {
        try { ytPlayer.destroy(); } catch {}
      }
      currentVideo = null;
      isFloatingDock = false;
    }

    function renderUpNext() {
      const container = document.getElementById("upNext");
      const next = loadedVideos
        .map((video, index) => ({ video, index }))
        .filter(item => item.index !== currentVideoIndex)
        .slice(0, 8);

      container.innerHTML = next.map(item => {
        const v = item.video;
        return `
          <button onclick="openVideo(${item.index})" class="w-full flex gap-2 text-left group hover:bg-ytPill/40 p-1 rounded-xl transition">
            <div class="w-28 aspect-video rounded-lg overflow-hidden shrink-0 bg-[#181818] relative">
              <img src="${escapeHTML(v.thumbnail)}" class="w-full h-full object-cover" loading="lazy" alt="" />
              ${v.duration ? `<span class="absolute bottom-1 right-1 bg-black/85 text-white text-[9px] font-medium px-1 rounded">${v.duration}</span>` : ""}
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="font-semibold text-xs leading-tight line-clamp-2 text-zinc-100">${escapeHTML(v.title)}</h3>
              <p class="text-[10px] text-zinc-400 mt-1 truncate">${escapeHTML(v.channelTitle)}</p>
              <p class="text-[10px] text-zinc-500">${formatNumber(v.views)} views</p>
            </div>
          </button>
        `;
      }).join("");
    }

    async function fetchComments(videoId) {
      const container = document.getElementById("comments");
      container.innerHTML = `<div class="text-[11px] text-zinc-500">Loading comments...</div>`;
      try {
        const data = await youtubeFetch("commentThreads", {
          part: "snippet", videoId, maxResults: 10, order: "relevance"
        });
        const items = data.items || [];
        document.getElementById("commentCount").textContent = items.length ? `(${items.length}+)` : "";
        if (!items.length) {
          container.innerHTML = `<div class="text-zinc-500 text-xs">No comments found.</div>`;
          return;
        }
        container.innerHTML = items.map(item => {
          const s = item.snippet?.topLevelComment?.snippet;
          if (!s) return "";
          return `
            <div class="flex gap-2.5 bg-[#181818]/70 p-2.5 rounded-xl border border-ytBorder/40">
              <div class="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-xs shrink-0 text-white">${escapeHTML((s.authorDisplayName || "U").charAt(0))}</div>
              <div class="min-w-0 flex-1 text-xs">
                <div class="font-bold text-zinc-200 flex items-center gap-1.5">
                  <span class="truncate">${escapeHTML(s.authorDisplayName)}</span>
                  <span class="text-[9px] font-normal text-zinc-500">${formatTimeAgo(s.publishedAt)}</span>
                </div>
                <div class="text-zinc-300 mt-1 text-[11px] leading-relaxed break-words">${escapeHTML(s.textDisplay)}</div>
              </div>
            </div>
          `;
        }).join("");
      } catch (error) {
        container.innerHTML = `<div class="text-[11px] text-zinc-500">Comments turned off for this stream.</div>`;
      }
    }

    function isLiked(videoId) { return likedVideos.some(v => v.id === videoId); }
    function toggleLikeCurrent() {
      if (!currentVideo) return;
      const index = likedVideos.findIndex(v => v.id === currentVideo.id);
      if (index >= 0) {
        likedVideos.splice(index, 1);
        showToast("Removed from liked");
      } else {
        likedVideos.unshift(currentVideo);
        showToast("Added to liked");
      }
      saveState();
      updateLikeButton();
    }

    function updateLikeButton() {
      const button = document.getElementById("likeBtn");
      if (!button || !currentVideo) return;
      const liked = isLiked(currentVideo.id);
      button.innerHTML = `
        <i class="${liked ? "fa-solid text-red-500" : "fa-regular"} fa-thumbs-up"></i>
        <span>${liked ? "Liked" : (formatNumber(currentVideo.likes) || "Like")}</span>
      `;
    }

    function isSubscribed(channelId) { return subscriptions.includes(channelId); }
    function toggleSubscribe() {
      if (!currentVideo?.channelId) return;
      const id = currentVideo.channelId;
      const index = subscriptions.indexOf(id);
      if (index >= 0) {
        subscriptions.splice(index, 1);
        showToast("Unsubscribed");
      } else {
        subscriptions.push(id);
        showToast("Subscribed");
      }
      saveState();
      updateSubscribeButton();
    }

    function updateSubscribeButton() {
      const button = document.getElementById("subscribeBtn");
      if (!button || !currentVideo) return;
      const subbed = isSubscribed(currentVideo.channelId);
      button.textContent = subbed ? "Subscribed" : "Subscribe";
      button.className = subbed
        ? "px-3 py-1 rounded-full bg-ytPill text-zinc-300 font-semibold text-xs border border-zinc-700/60"
        : "px-3.5 py-1.5 rounded-full bg-white text-black font-semibold text-xs";
    }

    function addToHistory(video) {
      history = history.filter(v => v.id !== video.id);
      history.unshift(video);
      history = history.slice(0, 100);
      saveState();
    }

    function renderLibrary() {
      activeTab = "library";
      updateSidebarState("library");
      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="max-w-xl mx-auto space-y-4">
          <div class="flex items-center justify-between">
            <h1 class="text-base font-bold flex items-center gap-1.5"><i class="fa-solid fa-folder text-red-500"></i> Library</h1>
            <button onclick="openPlaylistModal()" class="px-3 py-1.5 rounded-full bg-red-600 text-xs font-semibold">
              <i class="fa-solid fa-plus"></i> New
            </button>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="switchMainTab('history')" class="p-3 bg-[#181818] rounded-xl text-left border border-ytBorder/60">
              <i class="fa-solid fa-clock-rotate-left text-sm text-red-500 mb-1"></i>
              <h3 class="font-bold text-xs">History</h3>
              <p class="text-[10px] text-zinc-500">${history.length} watched</p>
            </button>
            <button onclick="switchMainTab('liked')" class="p-3 bg-[#181818] rounded-xl text-left border border-ytBorder/60">
              <i class="fa-solid fa-thumbs-up text-sm text-amber-400 mb-1"></i>
              <h3 class="font-bold text-xs">Liked</h3>
              <p class="text-[10px] text-zinc-500">${likedVideos.length} saved</p>
            </button>
          </div>
          <div>
            <h2 class="text-xs font-bold text-zinc-300 mb-2">Playlists</h2>
            <div id="playlistList" class="space-y-2"></div>
          </div>
        </div>
      `;
      renderPlaylists();
    }

    function renderPlaylists() {
      const container = document.getElementById("playlistList");
      if (!container) return;
      if (!playlists.length) {
        container.innerHTML = `<div class="p-4 rounded-xl bg-[#181818] text-zinc-500 text-xs">No playlists created yet.</div>`;
        return;
      }
      container.innerHTML = playlists.map(p => `
        <div class="p-3 rounded-xl bg-[#181818] flex items-center justify-between border border-ytBorder/40">
          <div>
            <h3 class="font-bold text-xs text-zinc-200">${escapeHTML(p.name)}</h3>
            <p class="text-[10px] text-zinc-500">${p.videos.length} tracks</p>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="deletePlaylist('${p.id}')" class="w-7 h-7 rounded-full text-zinc-400 hover:text-red-500 flex items-center justify-center">
              <i class="fa-solid fa-trash text-xs"></i>
            </button>
            <button onclick="playPlaylist('${p.id}')" class="px-3 py-1 rounded-full bg-ytPill text-xs font-semibold">Play</button>
          </div>
        </div>
      `).join("");
    }

    function deletePlaylist(id) {
      playlists = playlists.filter(p => p.id !== id);
      saveState();
      renderPlaylists();
      showToast("Playlist deleted");
    }

    let pendingVideoToSave = null;
    function openPlaylistModal(targetIndex = null) {
      if (targetIndex !== null && loadedVideos[targetIndex]) {
        pendingVideoToSave = loadedVideos[targetIndex];
      } else if (currentVideo) {
        pendingVideoToSave = currentVideo;
      } else if (loadedVideos.length > 0) {
        pendingVideoToSave = loadedVideos[0];
      } else {
        showToast("Select a video first");
        return;
      }

      const modal = document.getElementById("playlistModal");
      const listContainer = document.getElementById("modalPlaylistItems");
      modal.classList.remove("hidden");

      if (!playlists.length) {
        listContainer.innerHTML = `<p class="text-zinc-500 text-xs py-2 text-center">No playlists yet. Create below!</p>`;
        return;
      }

      listContainer.innerHTML = playlists.map(p => {
        const hasVideo = p.videos.some(v => v.id === pendingVideoToSave.id);
        return `
          <div class="flex items-center justify-between p-2 rounded-xl bg-ytPill cursor-pointer" onclick="toggleVideoInPlaylist('${p.id}')">
            <span class="text-xs font-semibold text-zinc-200 truncate pr-2">${escapeHTML(p.name)} (${p.videos.length})</span>
            <i class="fa-solid ${hasVideo ? "fa-check text-emerald-400" : "fa-plus text-zinc-400"} text-xs"></i>
          </div>
        `;
      }).join("");
    }

    function closePlaylistModal() {
      document.getElementById("playlistModal").classList.add("hidden");
      document.getElementById("newPlaylistInput").value = "";
    }

    function toggleVideoInPlaylist(playlistId) {
      if (!pendingVideoToSave) return;
      const pl = playlists.find(p => p.id === playlistId);
      if (!pl) return;

      const idx = pl.videos.findIndex(v => v.id === pendingVideoToSave.id);
      if (idx >= 0) {
        pl.videos.splice(idx, 1);
        showToast(`Removed from "${pl.name}"`);
      } else {
        pl.videos.push(pendingVideoToSave);
        showToast(`Saved to "${pl.name}"`);
      }
      saveState();
      openPlaylistModal();
      if (activeTab === "library") renderPlaylists();
    }

    function handleModalCreatePlaylist() {
      const input = document.getElementById("newPlaylistInput");
      const name = input.value.trim();
      if (!name) return;

      playlists.push({
        id: Date.now().toString(),
        name: name,
        videos: pendingVideoToSave ? [pendingVideoToSave] : []
      });
      saveState();
      input.value = "";
      showToast(`Created "${name}"`);
      openPlaylistModal();
      if (activeTab === "library") renderPlaylists();
    }

    function playPlaylist(playlistId) {
      const playlist = playlists.find(p => p.id === playlistId);
      if (!playlist || !playlist.videos.length) { showToast("Playlist is empty"); return; }
      loadedVideos = playlist.videos;
      currentVideoIndex = 0;
      openVideo(0);
    }

    function renderHistory() {
      activeTab = "history";
      updateSidebarState("history");
      const app = document.getElementById("app");
      if (!history.length) {
        renderEmpty("No history", "Watched videos appear here.");
        return;
      }
      app.innerHTML = `
        <div>
          <div class="flex items-center justify-between mb-3">
            <h1 class="text-base font-bold">History</h1>
            <button onclick="clearHistory()" class="px-3 py-1 rounded-full bg-ytPill text-xs font-semibold text-red-400">Clear</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">${history.map((v, i) => createStandaloneCard(v, "history", i)).join("")}</div>
        </div>
      `;
    }

    function clearHistory() {
      if (!confirm("Clear watch history?")) return;
      history = [];
      saveState();
      renderHistory();
    }

    function renderLiked() {
      activeTab = "liked";
      updateSidebarState("liked");
      const app = document.getElementById("app");
      if (!likedVideos.length) {
        renderEmpty("No liked videos", "Liked videos appear here.");
        return;
      }
      app.innerHTML = `
        <div>
          <h1 class="text-base font-bold mb-3">Liked Videos</h1>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">${likedVideos.map((v, i) => createStandaloneCard(v, "liked", i)).join("")}</div>
        </div>
      `;
    }

    function createStandaloneCard(video, type, index) {
      return `
        <article class="cursor-pointer group flex flex-col" onclick="openSavedVideo('${type}', ${index})">
          <div class="relative aspect-video rounded-xl overflow-hidden bg-[#181818]">
            <img src="${escapeHTML(video.thumbnail)}" class="w-full h-full object-cover" loading="lazy" alt="" />
            ${video.duration ? `<span class="absolute bottom-1 right-1 bg-black/85 text-white text-[9px] font-medium px-1 rounded">${escapeHTML(video.duration)}</span>` : ""}
          </div>
          <div class="flex gap-2 px-0.5 mt-2">
            <div class="w-7 h-7 rounded-full bg-red-600 flex items-center justify-center shrink-0 text-xs font-bold text-white">${escapeHTML((video.channelTitle || "S").charAt(0).toUpperCase())}</div>
            <div class="min-w-0 flex-1">
              <h3 class="font-semibold text-xs leading-snug line-clamp-2 text-zinc-200">${escapeHTML(video.title)}</h3>
              <p class="text-[10px] text-zinc-400 truncate">${escapeHTML(video.channelTitle)}</p>
            </div>
          </div>
        </article>
      `;
    }

    function openSavedVideo(source, index) {
      const list = source === "history" ? history : likedVideos;
      if (!list[index]) return;
      loadedVideos = list;
      currentVideoIndex = index;
      openVideo(index);
    }

    async function renderSubscriptions() {
      activeTab = "subscriptions";
      updateSidebarState("subscriptions");
      const app = document.getElementById("app");
      if (!subscriptions.length) {
        app.innerHTML = `
          <div class="min-h-[40vh] flex items-center justify-center text-center p-4">
            <div class="bg-[#181818] p-5 rounded-2xl border border-zinc-800 max-w-xs">
              <i class="fa-solid fa-layer-group text-xl text-zinc-500 mb-2"></i>
              <h2 class="text-sm font-bold">Subscriptions</h2>
              <p class="text-zinc-400 text-xs mt-1">Subscribe to channels to see them here.</p>
              <button onclick="searchYouTube('Trending Music Channels')" class="mt-3 px-4 py-1.5 rounded-full bg-white text-black text-xs font-semibold">Explore</button>
            </div>
          </div>
        `;
        return;
      }
      app.innerHTML = `
        <div>
          <h1 class="text-base font-bold mb-3">Subscriptions</h1>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3"></div>
        </div>
      `;
      const grid = app.querySelector(".grid");
      try {
        const videos = await youtubeFetch("search", { part: "snippet", type: "video", maxResults: 20, q: "India Entertainment" });
        const ids = (videos.items || []).map(item => item.id?.videoId).filter(Boolean);
        const details = await getVideoDetails(ids);
        const normalized = details.map(normalizeVideo);
        grid.innerHTML = normalized.map((v, i) => createVideoCard(v, i)).join("");
        loadedVideos = normalized;
      } catch {
        grid.innerHTML = `<div class="col-span-full text-zinc-500 text-xs">Failed to load channels.</div>`;
      }
    }

    function switchMainTab(tab) {
      if (tab === "home") {
        activeTab = "home";
        updateSidebarState("home");
        if (!loadedVideos.length || currentQuery === "Trending Songs India") getTrendingVideos();
        else renderHome();
      } else if (tab === "shorts") {
        openShorts();
      } else if (tab === "subscriptions") {
        renderSubscriptions();
      } else if (tab === "history") {
        renderHistory();
      } else if (tab === "liked") {
        renderLiked();
      } else if (tab === "library") {
        renderLibrary();
      }
    }

    function updateSidebarState(tab) {
      document.querySelectorAll(".sidebar-item").forEach(item => {
        item.classList.toggle("sidebar-active", item.dataset.tab === tab);
      });
    }

    function goHome() {
      if (currentVideo) minimizeToFloatingDock();
      else closeWatchView();
      closeShortsView();
      switchMainTab("home");
    }

    function closeWatchView() {
      document.getElementById("watchView").classList.add("hidden");
      document.body.style.overflow = "";
    }

    function openShorts() {
      const modal = document.getElementById("shortsView");
      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";
      renderShorts();
    }

    function closeShortsView() {
      document.getElementById("shortsView").classList.add("hidden");
      document.body.style.overflow = "";
    }

    function renderShorts() {
      const container = document.getElementById("shortsContainer");
      const videos = loadedVideos.length ? loadedVideos.slice(0, 6) : [];
      if (!videos.length) {
        container.innerHTML = `<div class="text-zinc-500 py-16 text-xs">Open home first to load shorts.</div>`;
        return;
      }
      container.innerHTML = videos.map((video, index) => `
        <div class="w-[min(90vw,360px)] aspect-[9/16] bg-[#181818] rounded-2xl overflow-hidden relative shadow-2xl border border-zinc-800">
          <img src="${escapeHTML(video.thumbnail)}" class="w-full h-full object-cover" loading="lazy" alt="" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-black/30"></div>
          <div class="absolute left-3 right-14 bottom-4">
            <h3 class="font-bold text-xs text-white line-clamp-2">${escapeHTML(video.title)}</h3>
            <p class="text-[11px] text-zinc-300 mt-1">${escapeHTML(video.channelTitle)}</p>
            <button onclick="closeShortsView(); openVideo(${index})" class="mt-2.5 px-3 py-1 rounded-full bg-white text-black text-xs font-bold">Watch Stream</button>
          </div>
        </div>
      `).join("");
    }

    function toggleAudioMode() {
      audioMode = !audioMode;
      const overlay = document.getElementById("audioOverlay");
      const headerBtn = document.getElementById("headerAudioBtn");
      if (audioMode) {
        overlay.classList.remove("hidden");
        if (headerBtn) headerBtn.innerHTML = `<i class="fa-solid fa-video text-emerald-400 text-xs"></i><span class="text-[11px]">Video</span>`;
        showToast("Audio Saver activated");
      } else {
        overlay.classList.add("hidden");
        if (headerBtn) headerBtn.innerHTML = `<i class="fa-solid fa-headphones text-red-500 text-xs"></i><span class="text-[11px]">Audio</span>`;
        showToast("Video stream restored");
      }
    }

    function openSleepModal() { document.getElementById("sleepModal").classList.remove("hidden"); document.getElementById("sleepModal").classList.add("flex"); }
    function closeSleepModal() { document.getElementById("sleepModal").classList.add("hidden"); document.getElementById("sleepModal").classList.remove("flex"); }
    function setSleepTimer(minutes) {
      clearTimeout(sleepTimer);
      sleepTimer = setTimeout(() => {
        closePlayerEntirely();
        showToast("Sleep timer: Player turned off");
      }, minutes * 60 * 1000);
      closeSleepModal();
      showToast(`Timer set: ${minutes}m`);
    }
    function cancelSleepTimer() {
      clearTimeout(sleepTimer);
      sleepTimer = null;
      closeSleepModal();
      showToast("Timer cancelled");
    }

    async function shareCurrentVideo() {
      if (!currentVideo) return;
      const url = SITE_URL + "?v=" + encodeURIComponent(currentVideo.id);
      if (navigator.share) {
        try {
          await navigator.share({ title: currentVideo.title, text: `Watch "${currentVideo.title}" on SKPlayer`, url });
          return;
        } catch {}
      }
      try {
        await navigator.clipboard.writeText(url);
        showToast("Link copied!");
      } catch {
        showToast(url);
      }
    }

    function startVoiceSearch() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast("Voice not supported on browser");
        return;
      }
      const modal = document.getElementById("voiceModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");

      const rec = new SpeechRecognition();
      rec.lang = "hi-IN";
      rec.onresult = e => {
        const text = e.results[0][0].transcript;
        document.getElementById("voiceText").textContent = text;
        setTimeout(() => {
          closeVoiceModal();
          searchYouTube(text);
        }, 350);
      };
      rec.onerror = () => { closeVoiceModal(); showToast("Voice failed"); };
      rec.onend = () => { setTimeout(() => closeVoiceModal(), 600); };
      rec.start();
    }

    function closeVoiceModal() {
      document.getElementById("voiceModal").classList.add("hidden");
      document.getElementById("voiceModal").classList.remove("flex");
    }

    document.addEventListener("DOMContentLoaded", () => {
      getTrendingVideos();
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get("v");
      if (videoId) {
        setTimeout(async () => {
          try {
            const vids = await getVideoDetails([videoId]);
            if (vids.length) {
              loadedVideos = vids.map(normalizeVideo);
              openVideo(0);
            }
          } catch {}
        }, 700);
      }
    });

    window.addEventListener("scroll", () => {
      if (activeTab !== "home") return;
      const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 600;
      if (nearBottom && nextPageToken && !isLoading) {
        loadMore();
      }
    });
  </script>
</body>
</html>
