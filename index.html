<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKPlayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white font-sans antialiased pb-12 select-none">

    <!-- Top Header -->
    <header class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur-md px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-black text-sm shadow-lg shadow-red-600/30">SK</div>
            <span class="text-lg font-bold tracking-tight">SK<span class="text-red-500">Player</span></span>
        </div>
        <div id="serverBadge" class="text-[11px] font-medium px-2 py-0.5 bg-green-500/10 text-green-400 border border-green-500/20 rounded-full">
            Ready
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-4">
        <!-- Search Field -->
        <div class="relative flex items-center mb-5">
            <input id="searchInput" type="text" placeholder="Search song, video, artist..." 
                   class="w-full bg-[#1e1e1e] text-sm text-zinc-100 placeholder-zinc-500 pl-4 pr-12 py-3 rounded-full border border-zinc-800 focus:outline-none focus:border-red-500 transition">
            <button onclick="handleSearch()" class="absolute right-1.5 w-9 h-9 bg-red-600 rounded-full flex items-center justify-center text-white">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </button>
        </div>

        <!-- Video Player Section -->
        <div id="playerSection" class="hidden mb-6">
            <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
                <video id="mainVideo" controls autoplay playsinline class="w-full h-full object-contain"></video>
            </div>
            <h1 id="playingTitle" class="text-base font-semibold mt-3 line-clamp-2"></h1>
            <p id="playerStatus" class="text-xs text-red-400 mt-1"></p>
        </div>

        <!-- Feed Status / Heading -->
        <div class="flex items-center justify-between mb-3">
            <h2 id="feedHeading" class="text-sm font-semibold text-zinc-400 uppercase tracking-wider">Recommended</h2>
        </div>

        <!-- Video Grid -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </main>

    <script>
        // High-availability open CORS Invidious instances
        const INVIDIOUS_INSTANCES = [
            "https://inv.tux.pizza",
            "https://invidious.jing.rocks",
            "https://invidious.nerdvpn.de",
            "https://vid.puffyan.us",
            "https://invidious.slipfox.xyz"
        ];

        let activeInstance = INVIDIOUS_INSTANCES[0];

        async function apiRequest(path) {
            for (let i = 0; i < INVIDIOUS_INSTANCES.length; i++) {
                const instance = INVIDIOUS_INSTANCES[i];
                try {
                    const controller = new AbortController();
                    const id = setTimeout(() => controller.abort(), 5000);
                    const res = await fetch(`${instance}/api/v1${path}`, { signal: controller.signal });
                    clearTimeout(id);

                    if (res.ok) {
                        activeInstance = instance;
                        document.getElementById('serverBadge').innerText = "Online";
                        return await res.json();
                    }
                } catch (e) {
                    console.warn(`Failed instance: ${instance}`);
                }
            }
            throw new Error("All endpoints busy");
        }

        const searchInput = document.getElementById('searchInput');
        const videoGrid = document.getElementById('videoGrid');
        const playerSec = document.getElementById('playerSection');
        const mainVideo = document.getElementById('mainVideo');
        const playingTitle = document.getElementById('playingTitle');
        const playerStatus = document.getElementById('playerStatus');

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        async function handleSearch() {
            const q = searchInput.value.trim();
            if (!q) return;

            document.getElementById('feedHeading').innerText = `Results for "${q}"`;
            videoGrid.innerHTML = `
                <div class="col-span-full py-12 flex justify-center items-center text-zinc-400 gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-red-500"></i> Searching videos...
                </div>`;

            try {
                const data = await apiRequest(`/search?q=${encodeURIComponent(q)}&type=video`);
                renderList(data);
            } catch (err) {
                videoGrid.innerHTML = `
                    <div class="col-span-full text-center py-8">
                        <p class="text-red-400 text-sm mb-3">All public mirrors are heavily loaded.</p>
                        <button onclick="handleSearch()" class="px-5 py-2 bg-red-600 rounded-xl text-xs font-semibold">Retry Search</button>
                    </div>`;
            }
        }

        async function loadInitialFeed() {
            videoGrid.innerHTML = `
                <div class="col-span-full py-12 flex justify-center items-center text-zinc-400 gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-red-500"></i> Loading Feed...
                </div>`;
            try {
                const data = await apiRequest(`/trending?region=IN`);
                renderList(data);
            } catch (err) {
                // trending fail ho toh default keyword search
                try {
                    const fallbackData = await apiRequest(`/search?q=punjabi+songs&type=video`);
                    renderList(fallbackData);
                } catch (e) {
                    videoGrid.innerHTML = `<p class="col-span-full text-center text-zinc-500 py-8 text-xs">Search using the top input bar</p>`;
                }
            }
        }

        function renderList(items) {
            if (!items || items.length === 0) {
                videoGrid.innerHTML = `<p class="col-span-full text-center text-zinc-400 py-6 text-sm">No videos found.</p>`;
                return;
            }

            videoGrid.innerHTML = items.filter(v => v.videoId).map(item => {
                const thumb = item.videoThumbnails?.find(t => t.quality === 'medium')?.url 
                           || `https://i.ytimg.com/vi/${item.videoId}/hqdefault.jpg`;

                return `
                    <div onclick="playStream('${item.videoId}', '${encodeURIComponent(item.title)}')" class="bg-[#181818] rounded-xl overflow-hidden cursor-pointer hover:bg-zinc-800 transition active:scale-[0.98]">
                        <div class="relative aspect-video">
                            <img src="${thumb}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${item.videoId}/mqdefault.jpg'">
                        </div>
                        <div class="p-3">
                            <h3 class="text-sm font-medium line-clamp-2">${item.title}</h3>
                            <p class="text-xs text-zinc-400 mt-1">${item.author || 'YouTube'}</p>
                        </div>
                    </div>`;
            }).join('');
        }

        async function playStream(id, title) {
            playerSec.classList.remove('hidden');
            playingTitle.innerText = decodeURIComponent(title);
            playerStatus.innerText = "Connecting to stream...";
            window.scrollTo({ top: 0, behavior: 'smooth' });

            try {
                // Invidious direct stream URL
                const data = await apiRequest(`/videos/${id}`);
                
                // Sabse acchi format select karein (combine audio+video format)
                const stream = data.formatStreams?.find(f => f.resolution === '720p') 
                            || data.formatStreams?.find(f => f.resolution === '360p')
                            || data.formatStreams?.[0];

                if (stream && stream.url) {
                    mainVideo.src = stream.url;
                    playerStatus.innerText = "";
                    mainVideo.play();
                } else {
                    // Agar direct format na mile toh Invidious proxy stream fallback
                    mainVideo.src = `${activeInstance}/latest_version?id=${id}&itag=22`;
                    playerStatus.innerText = "";
                    mainVideo.play();
                }
            } catch (e) {
                // Direct YouTube stream fallback link
                mainVideo.src = `${activeInstance}/latest_version?id=${id}&itag=18`;
                playerStatus.innerText = "";
                mainVideo.play().catch(() => {
                    playerStatus.innerText = "Video stream blocked by provider.";
                });
            }
        }

        loadInitialFeed();
    </script>
</body>
</html>
