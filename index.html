<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKPlayer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Pro Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Sans / Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar hide for mobile UX */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white selection:bg-red-600 pb-20 select-none">

    <!-- ======================================================== -->
    <!-- 1. YOUTUBE TOP NAVBAR                                    -->
    <!-- ======================================================== -->
    <header class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur-md px-3.5 py-2.5 flex items-center justify-between border-b border-zinc-800/60">
        <!-- Logo -->
        <div class="flex items-center gap-1.5 cursor-pointer" onclick="quickFilter('Trending')">
            <div class="w-7 h-5 bg-red-600 rounded-[6px] flex items-center justify-center shadow-md shadow-red-600/20">
                <i class="fa-solid fa-play text-white text-[10px] ml-0.5"></i>
            </div>
            <span class="text-[17px] font-bold tracking-tight flex items-center">
                SK<span class="text-zinc-100 font-medium ml-0.5">Player</span>
                <span class="ml-1 text-[9px] font-semibold bg-red-600/20 text-red-500 border border-red-500/30 px-1 py-0.2 rounded">PRO</span>
            </span>
        </div>

        <!-- Right Quick Actions -->
        <div class="flex items-center gap-4 text-zinc-200">
            <button onclick="toggleSearchBar()" class="hover:text-white transition">
                <i class="fa-solid fa-magnifying-glass text-lg"></i>
            </button>
            <button class="hover:text-white transition relative">
                <i class="fa-regular fa-bell text-lg"></i>
                <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-600 rounded-full"></span>
            </button>
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center font-bold text-xs ring-1 ring-zinc-700">
                S
            </div>
        </div>
    </header>

    <!-- Expandable Search Overlay Bar -->
    <div id="searchBarOverlay" class="hidden px-3 py-2 bg-[#121212] border-b border-zinc-800 sticky top-12 z-40">
        <div class="flex items-center gap-2">
            <button onclick="toggleSearchBar()" class="text-zinc-400 p-2">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="relative flex-1 flex items-center">
                <input id="searchInput" type="text" placeholder="Search YouTube..." 
                       class="w-full bg-[#202020] text-sm text-white placeholder-zinc-500 pl-4 pr-10 py-2 rounded-full border border-zinc-700 focus:outline-none focus:border-red-500">
                <button onclick="handleSearch()" class="absolute right-3 text-zinc-400 hover:text-white">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- 2. HORIZONTAL CATEGORY CHIPS                             -->
    <!-- ======================================================== -->
    <nav class="sticky top-[49px] z-30 bg-[#0f0f0f] py-2 px-3 flex gap-2 overflow-x-auto no-scrollbar border-b border-zinc-900">
        <button onclick="quickFilter('All Trending')" class="chip-btn active px-3.5 py-1.5 bg-white text-black text-xs font-semibold rounded-lg whitespace-nowrap">All</button>
        <button onclick="quickFilter('New Music Videos')" class="chip-btn px-3.5 py-1.5 bg-[#272727] text-zinc-200 text-xs font-medium rounded-lg whitespace-nowrap hover:bg-[#383838]">Music</button>
        <button onclick="quickFilter('Trending Gaming')" class="chip-btn px-3.5 py-1.5 bg-[#272727] text-zinc-200 text-xs font-medium rounded-lg whitespace-nowrap hover:bg-[#383838]">Gaming</button>
        <button onclick="quickFilter('Bollywood Superhits')" class="chip-btn px-3.5 py-1.5 bg-[#272727] text-zinc-200 text-xs font-medium rounded-lg whitespace-nowrap hover:bg-[#383838]">Bollywood</button>
        <button onclick="quickFilter('Punjabi Hits 2026')" class="chip-btn px-3.5 py-1.5 bg-[#272727] text-zinc-200 text-xs font-medium rounded-lg whitespace-nowrap hover:bg-[#383838]">Punjabi</button>
        <button onclick="quickFilter('Podcasts Hindi')" class="chip-btn px-3.5 py-1.5 bg-[#272727] text-zinc-200 text-xs font-medium rounded-lg whitespace-nowrap hover:bg-[#383838]">Podcasts</button>
        <button onclick="quickFilter('Live News India')" class="chip-btn px-3.5 py-1.5 bg-[#272727] text-zinc-200 text-xs font-medium rounded-lg whitespace-nowrap hover:bg-[#383838]">News</button>
    </nav>

    <!-- ======================================================== -->
    <!-- 3. STICKY DEDICATED YOUTUBE VIDEO PLAYER                 -->
    <!-- ======================================================== -->
    <div id="playerSection" class="hidden sticky top-[48px] z-40 bg-[#0f0f0f] shadow-2xl">
        <div class="relative w-full aspect-video bg-black">
            <iframe id="mainFrame" class="w-full h-full border-0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
            </iframe>
        </div>

        <!-- Video Metadata Area -->
        <div class="p-3 bg-[#0f0f0f] border-b border-zinc-800">
            <div class="flex items-start justify-between gap-3">
                <h1 id="playingTitle" class="text-sm font-semibold leading-snug line-clamp-2 text-zinc-100"></h1>
                <button onclick="closePlayer()" class="text-zinc-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <p id="playingMeta" class="text-[12px] text-zinc-400 mt-1">1.2M views • 2 days ago</p>

            <!-- Channel Details & Subscribe Button -->
            <div class="flex items-center justify-between mt-3 pt-2 border-t border-zinc-800/60">
                <div class="flex items-center gap-2.5">
                    <div id="channelAvatar" class="w-9 h-9 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center font-bold text-xs uppercase text-white">
                        YT
                    </div>
                    <div>
                        <h4 id="playingChannel" class="text-xs font-semibold text-white flex items-center gap-1"></h4>
                        <span class="text-[10px] text-zinc-400">1.45M subscribers</span>
                    </div>
                </div>
                <button id="subBtn" onclick="toggleSub()" class="bg-white text-black hover:bg-zinc-200 px-3.5 py-1.5 rounded-full text-xs font-bold transition">
                    Subscribe
                </button>
            </div>

            <!-- Action Buttons Row -->
            <div class="flex items-center gap-2 mt-3.5 overflow-x-auto no-scrollbar text-xs">
                <div class="flex items-center bg-[#222] rounded-full px-3 py-1.5 gap-2 border border-zinc-800">
                    <button class="flex items-center gap-1.5 hover:text-red-500"><i class="fa-regular fa-thumbs-up"></i> 142K</button>
                    <span class="text-zinc-600">|</span>
                    <button class="hover:text-red-500"><i class="fa-regular fa-thumbs-down"></i></button>
                </div>
                <button class="flex items-center gap-1.5 bg-[#222] border border-zinc-800 px-3.5 py-1.5 rounded-full hover:bg-[#333]">
                    <i class="fa-solid fa-share"></i> Share
                </button>
                <button class="flex items-center gap-1.5 bg-[#222] border border-zinc-800 px-3.5 py-1.5 rounded-full hover:bg-[#333]">
                    <i class="fa-solid fa-arrow-down"></i> Download
                </button>
                <button class="flex items-center gap-1.5 bg-[#222] border border-zinc-800 px-3.5 py-1.5 rounded-full hover:bg-[#333]">
                    <i class="fa-regular fa-bookmark"></i> Save
                </button>
            </div>
        </div>
    </div>

    <!-- ======================================================== -->
    <!-- 4. YOUTUBE NATIVE FEED (FULL-WIDTH CARDS)                -->
    <!-- ======================================================== -->
    <main class="max-w-xl mx-auto">
        <div id="videoFeed" class="flex flex-col gap-5 pt-2"></div>
    </main>

    <!-- ======================================================== -->
    <!-- 5. YOUTUBE NATIVE BOTTOM TAB BAR                         -->
    <!-- ======================================================== -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0f0f0f]/98 backdrop-blur-md border-t border-zinc-800/80 px-4 py-2 flex items-center justify-around text-zinc-400">
        <button onclick="quickFilter('Trending'); setTab(this)" class="nav-tab active flex flex-col items-center gap-1 text-white">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-medium tracking-tight">Home</span>
        </button>
        <button onclick="quickFilter('YouTube Shorts'); setTab(this)" class="nav-tab flex flex-col items-center gap-1">
            <i class="fa-solid fa-bolt text-base"></i>
            <span class="text-[10px] font-medium tracking-tight">Shorts</span>
        </button>
        <button onclick="toggleSearchBar()" class="flex flex-col items-center justify-center -mt-2">
            <div class="w-9 h-9 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-white text-base">
                <i class="fa-solid fa-plus"></i>
            </div>
        </button>
        <button onclick="quickFilter('Subscriptions Feed'); setTab(this)" class="nav-tab flex flex-col items-center gap-1">
            <i class="fa-solid fa-layer-group text-base"></i>
            <span class="text-[10px] font-medium tracking-tight">Subscriptions</span>
        </button>
        <button onclick="setTab(this)" class="nav-tab flex flex-col items-center gap-1">
            <div class="w-4 h-4 rounded-full bg-red-600 flex items-center justify-center text-[9px] text-white font-bold">S</div>
            <span class="text-[10px] font-medium tracking-tight">You</span>
        </button>
    </nav>

    <!-- ======================================================== -->
    <!-- JAVASCRIPT ENGINE & API INTEGRATION                      -->
    <!-- ======================================================== -->
    <script>
        // 🔑 APNI YOUTUBE DATA API KEY YAHAN DAALEIN:
        const YOUTUBE_API_KEY = "AIzaSyBeFQ9lfxdr5nAY1F4yLlt-GaPIAruDPKY";

        const videoFeed = document.getElementById('videoFeed');
        const playerSec = document.getElementById('playerSection');
        const mainFrame = document.getElementById('mainFrame');
        const searchInput = document.getElementById('searchInput');
        const searchBarOverlay = document.getElementById('searchBarOverlay');

        function toggleSearchBar() {
            searchBarOverlay.classList.toggle('hidden');
            if (!searchBarOverlay.classList.contains('hidden')) {
                searchInput.focus();
            }
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        function setTab(btn) {
            document.querySelectorAll('.nav-tab').forEach(b => {
                b.classList.remove('text-white');
                b.classList.add('text-zinc-400');
            });
            btn.classList.add('text-white');
            btn.classList.remove('text-zinc-400');
        }

        function quickFilter(q) {
            // Update Chip UI styles
            document.querySelectorAll('.chip-btn').forEach(btn => {
                if (btn.innerText.toLowerCase() === q.toLowerCase()) {
                    btn.className = "chip-btn active px-3.5 py-1.5 bg-white text-black text-xs font-semibold rounded-lg whitespace-nowrap";
                } else {
                    btn.className = "chip-btn px-3.5 py-1.5 bg-[#272727] text-zinc-200 text-xs font-medium rounded-lg whitespace-nowrap hover:bg-[#383838]";
                }
            });
            fetchVideos(q);
        }

        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) return;
            searchBarOverlay.classList.add('hidden');
            fetchVideos(query);
        }

        async function fetchVideos(query = 'Trending India') {
            videoFeed.innerHTML = `
                <div class="py-24 flex flex-col items-center justify-center gap-3 text-zinc-400">
                    <i class="fa-solid fa-circle-notch fa-spin text-red-600 text-3xl"></i>
                    <p class="text-xs font-medium tracking-wide">Loading feed...</p>
                </div>`;

            try {
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=25&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY.trim()}`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);
                renderNativeFeed(data.items || []);
            } catch (err) {
                videoFeed.innerHTML = `
                    <div class="mx-4 my-8 p-5 bg-zinc-900/60 rounded-2xl border border-zinc-800 text-center">
                        <i class="fa-solid fa-triangle-exclamation text-red-500 text-2xl mb-2"></i>
                        <p class="text-sm font-semibold text-zinc-200">Unable to load feed</p>
                        <p class="text-xs text-zinc-400 mt-1">${err.message}</p>
                    </div>`;
            }
        }

        function renderNativeFeed(items) {
            if (!items.length) {
                videoFeed.innerHTML = `<p class="text-center text-zinc-500 py-16 text-sm">No videos found</p>`;
                return;
            }

            videoFeed.innerHTML = items.map(item => {
                const id = item.id?.videoId;
                if (!id) return '';

                const snip = item.snippet;
                const thumb = snip.thumbnails?.high?.url || snip.thumbnails?.medium?.url;
                const timeAgo = formatTimeAgo(snip.publishedAt);
                const fakeViews = (Math.random() * (900 - 50) + 50).toFixed(0) + 'K';

                return `
                    <article onclick="playVideo('${id}', '${encodeURIComponent(snip.title)}', '${encodeURIComponent(snip.channelTitle)}')" 
                             class="flex flex-col cursor-pointer active:bg-zinc-900/40 transition">
                        
                        <!-- Thumbnail Frame -->
                        <div class="relative w-full aspect-video bg-zinc-900 overflow-hidden sm:rounded-2xl">
                            <img src="${thumb}" loading="lazy" class="w-full h-full object-cover">
                            <!-- Duration Badge -->
                            <span class="absolute bottom-2.5 right-2.5 bg-black/85 text-white font-medium text-[11px] px-1.5 py-0.5 rounded">
                                ${(Math.random() * 10 + 2).toFixed(0)}:${Math.floor(Math.random() * 50 + 10)}
                            </span>
                        </div>

                        <!-- Card Info Bar -->
                        <div class="flex items-start gap-3 px-3 py-3">
                            <!-- Channel Avatar Circle -->
                            <div class="w-9 h-9 rounded-full bg-zinc-800 border border-zinc-700/80 flex items-center justify-center font-bold text-xs flex-shrink-0 text-zinc-300">
                                ${snip.channelTitle.charAt(0).toUpperCase()}
                            </div>

                            <!-- Meta -->
                            <div class="flex-1 min-w-0">
                                <h3 class="text-sm font-normal text-zinc-100 line-clamp-2 leading-snug">
                                    ${snip.title}
                                </h3>
                                <div class="text-[12px] text-zinc-400 mt-1 flex items-center gap-1.5 flex-wrap">
                                    <span>${snip.channelTitle}</span>
                                    <span>•</span>
                                    <span>${fakeViews} views</span>
                                    <span>•</span>
                                    <span>${timeAgo}</span>
                                </div>
                            </div>

                            <!-- Kebab Menu -->
                            <button class="text-zinc-400 hover:text-white p-1 flex-shrink-0">
                                <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
                            </button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function playVideo(id, title, channel) {
            playerSec.classList.remove('hidden');
            const cleanTitle = decodeURIComponent(title);
            const cleanChannel = decodeURIComponent(channel);

            document.getElementById('playingTitle').innerText = cleanTitle;
            document.getElementById('playingChannel').innerText = cleanChannel;
            document.getElementById('channelAvatar').innerText = cleanChannel.charAt(0).toUpperCase();

            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Ad-Free Embed Player with privacy sandbox
            mainFrame.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3`;
        }

        function closePlayer() {
            playerSec.classList.add('hidden');
            mainFrame.src = '';
        }

        function toggleSub() {
            const btn = document.getElementById('subBtn');
            if (btn.innerText === "Subscribe") {
                btn.innerText = "Subscribed";
                btn.className = "bg-[#272727] text-zinc-300 px-3.5 py-1.5 rounded-full text-xs font-semibold";
            } else {
                btn.innerText = "Subscribe";
                btn.className = "bg-white text-black hover:bg-zinc-200 px-3.5 py-1.5 rounded-full text-xs font-bold transition";
            }
        }

        function formatTimeAgo(isoDate) {
            const diff = Math.floor((new Date() - new Date(isoDate)) / 1000);
            if (diff < 3600) return `${Math.floor(diff / 60)} mins ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`;
            if (diff < 2592000) return `${Math.floor(diff / 86400)} days ago`;
            return `${Math.floor(diff / 2592000)} months ago`;
        }

        // Initialize Native Feed
        quickFilter('Trending Songs India');
    </script>
</body>
</html>
