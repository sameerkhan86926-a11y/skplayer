<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SKPlayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f0f0f] text-white font-sans antialiased pb-12">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#0f0f0f]/95 backdrop-blur-md px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center font-black text-sm shadow-lg shadow-red-600/30">SK</div>
            <span class="text-lg font-bold tracking-tight">SK<span class="text-red-500">Player</span></span>
        </div>
        <span class="text-xs font-semibold px-2 py-0.5 bg-red-500/10 text-red-400 border border-red-500/20 rounded-full">Ad-Free</span>
    </header>

    <main class="max-w-3xl mx-auto px-4 pt-4">
        <!-- Search -->
        <div class="relative flex items-center mb-5">
            <input id="searchInput" type="text" placeholder="Search videos..." 
                   class="w-full bg-[#1e1e1e] text-sm text-zinc-100 placeholder-zinc-500 pl-4 pr-12 py-3 rounded-full border border-zinc-800 focus:outline-none focus:border-red-500">
            <button onclick="handleSearch()" class="absolute right-1.5 w-9 h-9 bg-red-600 rounded-full flex items-center justify-center text-white">
                <i class="fa-solid fa-magnifying-glass text-xs"></i>
            </button>
        </div>

        <!-- Video Player -->
        <div id="playerSection" class="hidden mb-6">
            <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
                <video id="mainVideo" controls autoplay playsinline class="w-full h-full object-contain"></video>
            </div>
            <h1 id="playingTitle" class="text-base font-semibold mt-3 line-clamp-2"></h1>
        </div>

        <!-- Video Feed -->
        <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </main>

    <script>
        const API_BASE = "https://pipedapi.kavin.rocks";

        async function loadTrending() {
            const res = await fetch(`${API_BASE}/trending?region=IN`);
            const data = await res.json();
            renderList(data);
        }

        async function handleSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}&filter=videos`);
            const data = await res.json();
            renderList(data.items);
        }

        function renderList(items) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = items.map(item => {
                const vidId = item.url ? item.url.replace('/watch?v=', '') : '';
                return `
                    <div onclick="playStream('${vidId}', '${encodeURIComponent(item.title)}')" class="bg-[#181818] rounded-xl overflow-hidden cursor-pointer hover:bg-zinc-800 transition active:scale-[0.98]">
                        <img src="${item.thumbnail}" class="w-full aspect-video object-cover" loading="lazy">
                        <div class="p-3">
                            <h3 class="text-sm font-medium line-clamp-2">${item.title}</h3>
                            <p class="text-xs text-zinc-400 mt-1">${item.uploaderName || 'Creator'}</p>
                        </div>
                    </div>`;
            }).join('');
        }

        async function playStream(id, title) {
            const playerSec = document.getElementById('playerSection');
            const video = document.getElementById('mainVideo');
            document.getElementById('playingTitle').innerText = decodeURIComponent(title);
            playerSec.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const res = await fetch(`${API_BASE}/streams/${id}`);
            const data = await res.json();
            
            // Sabse best video stream select karna
            const stream = data.videoStreams.find(s => s.quality === "720p" && !s.videoOnly) || data.videoStreams[0];
            if (stream && stream.url) {
                video.src = stream.url;
                video.play();
            } else {
                alert("Stream format unavailable.");
            }
        }

        loadTrending();
    </script>
</body>
</html>
