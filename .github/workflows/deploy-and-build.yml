name: Deploy Web and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Android APK
        run: |
          npm install -g cordova
          
          # Clean working directory
          rm -rf skplayer_app
          cordova create skplayer_app com.skplayer.app SKPlayer
          
          # Clean default template
          rm -rf skplayer_app/www/*
          
          # Copy web assets safely
          rsync -av --exclude='skplayer_app' --exclude='.git' --exclude='.github' ./ skplayer_app/www/
          
          cd skplayer_app
          
          # Safe Configuration File
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.skplayer.app" version="1.0.5" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>SKPlayer</name>
              <description>SKPlayer Ad-Free Video App</description>
              <author email="dev@skplayer.app">Sameer</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <preference name="ScrollEnabled" value="false" />
              <preference name="KeepRunning" value="true" />
              <preference name="AllowInlineMediaPlayback" value="true" />
              <preference name="MediaPlaybackRequiresUserAction" value="false" />
              
              <platform name="android">
                  <config-file target="AndroidManifest.xml" parent="/*">
                      <uses-permission android:name="android.permission.INTERNET" />
                      <uses-permission android:name="android.permission.RECORD_AUDIO" />
                      <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
                      <uses-permission android:name="android.permission.WAKE_LOCK" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
                      <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
                  </config-file>
              </platform>
          </widget>
          EOF

          # Add Android platform
          cordova platform add android@12.0.1
          cordova prepare android

          # Inject PiP flags directly into Manifest without edit-config crash
          MANIFEST_FILE="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/<activity /<activity android:supportsPictureInPicture="true" android:configChanges="screenSize|smallestScreenSize|screenLayout|orientation" /g' "$MANIFEST_FILE"
          fi

          # Copy Icons if available
          mkdir -p platforms/android/app/src/main/res/mipmap-hdpi
          mkdir -p platforms/android/app/src/main/res/mipmap-xhdpi
          mkdir -p platforms/android/app/src/main/res/mipmap-xxhdpi
          mkdir -p platforms/android/app/src/main/res/mipmap-xxxhdpi
          
          [ -f "../android-chrome-192x192.png" ] && cp ../android-chrome-192x192.png platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          [ -f "../android-chrome-192x192.png" ] && cp ../android-chrome-192x192.png platforms/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          [ -f "../android-chrome-512x512.png" ] && cp ../android-chrome-512x512.png platforms/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          [ -f "../android-chrome-512x512.png" ] && cp ../android-chrome-512x512.png platforms/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

          # Build APK
          cordova build android --debug -- --gradleArg=-PcdvMinSdkVersion=24

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find skplayer_app/platforms/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not generated!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SKPlayer-Release-APK
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.5-build-${{ github.run_number }}"
          name: "SKPlayer v1.0.5 (Build ${{ github.run_number }})"
          body: "Auto build with Native PiP support, background audio playback, and ad-free player."
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
