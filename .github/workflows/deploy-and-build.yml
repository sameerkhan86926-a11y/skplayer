name: Deploy Web & Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions needed for GitHub Pages deploy
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==============================
  # JOB 1: Deploy to GitHub Pages
  # ==============================
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Static Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Root directory ko deploy karega jahan index.html hai
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
     # ==============================
  # JOB 2: Build Android APK
  # ==============================
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Prepare Capacitor App
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp -r index.html manifest.json www/ 2>/dev/null || cp index.html www/
          
          # Force set webDir to www
          echo '{"appId":"com.skplayer.app","appName":"SKPlayer","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload SKPlayer APK
        uses: actions/upload-artifact@v4
        with:
          name: SKPlayer-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
