name: Deploy Web and Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ---------------------------------------------
  # JOB 1: GitHub Pages Live Deploy
  # ---------------------------------------------
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------
  # JOB 2: Build Android APK
  # ---------------------------------------------
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build Android APK via Cordova
        run: |
          npm install -g cordova
          cordova create skplayer_app com.skplayer.app SKPlayer
          cd skplayer_app
          rm -rf www/*
          cp ../index.html www/
          cordova platform add android
          cordova build android --debug

      - name: Upload SKPlayer APK
        uses: actions/upload-artifact@v4
        with:
          name: SKPlayer-Release-APK
          path: skplayer_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
